<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">

<title>Movimiento Inteligente</title>
<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icon-192.png">


<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Concepto: paneles de cristal flotando sobre una nebulosa nocturna (el astronauta y la medusa del logo).
   Bento-grid, vitromorfosis, oscuro por defecto con tema claro alternativo. */
:root{
  --bg:#060b21; --glass:rgba(255,255,255,.065); --glass-2:rgba(255,255,255,.11); --rim:rgba(255,255,255,.22);
  --line:rgba(255,255,255,.11); --fg:#eaeefb; --muted:#9ea9cc; --field:rgba(4,10,34,.55);
  --teal:#3de0c5; --pink:#ff6aa9; --amber:#ffb85c;
  --ok:#34d399; --bad:#ff5d6c; --warn:#ffb85c;
  --ok-soft:rgba(52,211,153,.15); --bad-soft:rgba(255,93,108,.16); --warn-soft:rgba(255,184,92,.16); --mute-soft:rgba(255,255,255,.08);
  --on-solid:#04122a; --shadow:0 12px 40px rgba(0,0,0,.38);
  --blob1:rgba(61,224,197,.22); --blob2:rgba(255,106,169,.18); --blob3:rgba(86,110,255,.2);
  --font-d:'Fraunces',Georgia,'Times New Roman',serif; --font-u:'Jost','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#e9eef9; --glass:rgba(255,255,255,.66); --glass-2:rgba(255,255,255,.9); --rim:rgba(255,255,255,.95);
    --line:rgba(10,22,70,.13); --fg:#0d1633; --muted:#4a5578; --field:rgba(255,255,255,.9);
    --teal:#0a8a78; --pink:#b81d65; --amber:#935400;
    --ok:#0a7d55; --bad:#c0263a; --warn:#935400;
    --ok-soft:rgba(10,125,85,.12); --bad-soft:rgba(192,38,58,.12); --warn-soft:rgba(147,84,0,.13); --mute-soft:rgba(10,22,70,.07);
    --on-solid:#ffffff; --shadow:0 10px 30px rgba(30,45,110,.14);
    --blob1:rgba(10,138,120,.2); --blob2:rgba(184,29,101,.14); --blob3:rgba(60,90,230,.16);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#e9eef9; --glass:rgba(255,255,255,.66); --glass-2:rgba(255,255,255,.9); --rim:rgba(255,255,255,.95);
  --line:rgba(10,22,70,.13); --fg:#0d1633; --muted:#4a5578; --field:rgba(255,255,255,.9);
  --teal:#0a8a78; --pink:#b81d65; --amber:#935400;
  --ok:#0a7d55; --bad:#c0263a; --warn:#935400;
  --ok-soft:rgba(10,125,85,.12); --bad-soft:rgba(192,38,58,.12); --warn-soft:rgba(147,84,0,.13); --mute-soft:rgba(10,22,70,.07);
  --on-solid:#ffffff; --shadow:0 10px 30px rgba(30,45,110,.14);
  --blob1:rgba(10,138,120,.2); --blob2:rgba(184,29,101,.14); --blob3:rgba(60,90,230,.16);
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-u);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 80px;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:70}
.aurora{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(520px 420px at 12% 8%,var(--blob1),transparent 70%),radial-gradient(560px 460px at 92% 18%,var(--blob3),transparent 70%),radial-gradient(600px 480px at 70% 98%,var(--blob2),transparent 70%)}
.wrap{max-width:1180px;margin:0 auto;min-width:0}
h1,h2,h3{font-family:var(--font-d);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:clamp(26px,5vw,36px);line-height:1.1}
h2{font-size:21px}
h3{font-size:17px}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{border-radius:12px;display:block;border:1px solid var(--line)}
.b1{font-weight:300;font-size:15px;letter-spacing:.08em;line-height:1.1;overflow-wrap:anywhere}
.b2{font-weight:600;font-size:12px;letter-spacing:.3em;margin-top:3px;color:var(--teal)}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrl select{min-height:44px;width:auto;padding:6px 12px;font-size:14px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--glass);color:var(--muted);font:500 14px var(--font-u);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--teal);color:var(--on-solid);border-color:transparent;font-weight:600}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;padding:8px 0;background:var(--bg)}
nav.tabs .scroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
nav.tabs .scroll::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;min-height:48px;padding:0 16px;border-radius:14px;border:1px solid var(--line);background:var(--glass);color:var(--muted);font:500 15px var(--font-u);cursor:pointer;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.tab[aria-current="page"]{color:var(--on-solid);background:var(--teal);border-color:transparent;font-weight:600}
main{padding-top:14px;display:flex;flex-direction:column;gap:16px}
.glass{background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:18px;box-shadow:inset 0 1px 0 var(--rim),var(--shadow);padding:20px;min-width:0}
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:900px){.c3,.c4{grid-column:span 6}.c5,.c6,.c7,.c8{grid-column:span 12}}
@media (max-width:560px){.c4{grid-column:span 12}.glass{padding:16px}.bento{gap:12px}}
.kpi .v{font-family:var(--font-d);font-size:clamp(24px,4.5vw,34px);font-weight:600;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .f{font-size:12.5px;color:var(--muted);margin-top:8px}
.btn{min-height:48px;padding:0 20px;border-radius:14px;border:1px solid transparent;background:var(--teal);color:var(--on-solid);font:600 15px var(--font-u);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.ghost{background:var(--glass-2);color:var(--fg);border-color:var(--line)}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px}
.btn:focus-visible,.tab:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--pink);outline-offset:2px}
label{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
input,select,textarea{min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--fg);font:400 16px var(--font-u);padding:10px 14px;width:100%;min-width:0}
textarea{min-height:92px;resize:vertical}
input[type="checkbox"]{width:22px;height:22px;min-height:0;accent-color:var(--teal)}
.chk{flex-direction:row;align-items:center;gap:10px;color:var(--fg);font-size:15px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.form .full{grid-column:1/-1}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar .grow{flex:1 1 220px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--glass)}
.item .grow{flex:1 1 200px;min-width:0}
button.item{width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit}
.nm{font-weight:600;font-size:16px;overflow-wrap:anywhere}
.meta{font-size:13.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;min-height:26px;padding:0 10px;border-radius:99px;font-size:12.5px;font-weight:600;white-space:nowrap}
.pill.ok{color:var(--ok);background:var(--ok-soft)}.pill.warn{color:var(--warn);background:var(--warn-soft)}
.pill.bad{color:var(--bad);background:var(--bad-soft)}.pill.mute{color:var(--muted);background:var(--mute-soft)}
.chip{font-size:12.5px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 10px;white-space:nowrap}
.empty{color:var(--muted);padding:18px;text-align:center;border:1px dashed var(--line);border-radius:14px}
.note{font-size:14px;color:var(--muted)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px solid var(--amber);background:var(--warn-soft);border-radius:16px;padding:12px 16px;font-size:14.5px}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.bars{display:grid;gap:5px;align-items:end}
.bcol{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0}
.bf{width:100%;max-width:28px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--teal),var(--pink));min-height:3px}
.bf.z{background:var(--mute-soft)}
.bv{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--fg)}
.bl{font-size:11px;color:var(--muted);text-align:center;line-height:1.15}
.bl.t{color:var(--teal);font-weight:600}
.hbar{display:grid;grid-template-columns:minmax(80px,130px) 1fr 44px;gap:10px;align-items:center;margin:8px 0;font-size:14px}
.hbar span{overflow-wrap:anywhere}
.hbar .tr{height:10px;border-radius:99px;background:var(--mute-soft);overflow:hidden}
.hbar .fl{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--pink))}
.hbar b{font-variant-numeric:tabular-nums;text-align:right}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.day{border:1px solid var(--line);border-radius:16px;padding:14px;background:var(--glass);display:flex;flex-direction:column;gap:10px;min-width:0}
.day.today{border-color:var(--teal)}
.slot{display:flex;flex-direction:column;gap:6px;padding:10px;border-radius:12px;background:var(--mute-soft)}
.slot .tm{font-family:var(--font-d);font-size:20px;font-variant-numeric:tabular-nums}
.meter{height:8px;border-radius:99px;background:var(--mute-soft);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),var(--pink))}
.meter.full i{background:var(--bad)}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(2,6,22,.62);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{width:100%;max-width:600px;background:var(--bg);border:1px solid var(--line);border-radius:20px;box-shadow:inset 0 1px 0 var(--rim),var(--shadow);padding:22px;margin:auto;display:flex;flex-direction:column;gap:16px}
.club{border-radius:20px;padding:18px;background:linear-gradient(145deg,#0b1a52,#0a0f33 55%,#2a0f45);color:#eaeefb;border:1px solid rgba(255,255,255,.22);box-shadow:inset 0 1px 0 rgba(255,255,255,.3);display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.club .cn{font-family:var(--font-d);font-size:22px;line-height:1.15;overflow-wrap:anywhere}
.club .cm{font-size:13px;color:#b8c2e6;margin-top:4px}
.club .ck{font-size:11px;letter-spacing:.24em;color:#3de0c5;font-weight:600}
.club .code{font-variant-numeric:tabular-nums;letter-spacing:.12em;font-size:13px;margin-top:10px;color:#eaeefb}
.qr{background:#fff;padding:8px;border-radius:12px;width:148px;height:148px;display:flex;align-items:center;justify-content:center;color:#04122a;font-size:12px;text-align:center}
.qr img{display:block}
.stamps{grid-column:1/-1;display:flex;gap:7px;flex-wrap:wrap}
.st{width:24px;height:24px;border-radius:50%;border:1.5px solid rgba(255,255,255,.4)}
.st.on{background:linear-gradient(135deg,#3de0c5,#ff6aa9);border-color:transparent}
@media (max-width:420px){.club{grid-template-columns:1fr}.qr{justify-self:center}}
.gate{border-radius:22px;padding:26px 20px;text-align:center;color:var(--on-solid);display:flex;flex-direction:column;align-items:center;gap:6px}
.gate.ok{background:var(--ok)}.gate.warn{background:var(--amber)}.gate.bad{background:var(--bad)}.gate.mute{background:var(--muted)}
.gate .gt{font-size:13px;letter-spacing:.18em;font-weight:600}
.gate .gn{font-family:var(--font-d);font-size:clamp(28px,6vw,44px);line-height:1.1;overflow-wrap:anywhere}
.gate .gm{font-size:15px;max-width:42ch}
.gate .av{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.28);font-family:var(--font-d);font-size:30px;font-weight:600}
.gate ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:15px;font-weight:500}
.idle{border-radius:22px;padding:34px 20px;text-align:center;border:2px dashed var(--line);color:var(--muted)}
.idle b{display:block;font-family:var(--font-d);font-size:26px;color:var(--fg);margin-bottom:6px}
.kiosk{position:fixed;inset:0;z-index:60;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column;gap:18px;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
.kiosk .clock{font-family:var(--font-d);font-size:clamp(34px,8vw,64px);font-variant-numeric:tabular-nums;line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:500;font-size:15px;z-index:90;max-width:calc(100vw - 32px);box-shadow:var(--shadow)}
.prog{white-space:pre-wrap;font-size:15px;margin:4px 0 0;overflow-wrap:anywhere}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.prods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prod{min-height:92px;border-radius:14px;border:1px solid var(--line);background:var(--glass-2);color:var(--fg);text-align:left;padding:10px 12px;cursor:pointer;font:inherit;display:flex;flex-direction:column;justify-content:space-between;gap:6px;border-left:5px solid var(--teal)}
.prod.c-Suplementos{border-left-color:var(--pink)}.prod.c-Alimentos{border-left-color:var(--amber)}.prod.c-Bebidas{border-left-color:var(--teal)}
.prod .pn{font-weight:600;font-size:14.5px;line-height:1.2}
.prod .pp{font-variant-numeric:tabular-nums;font-size:15px}
.prod:disabled{opacity:.45;cursor:not-allowed}
.cartrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--glass-2);color:var(--fg);font:600 18px var(--font-u);cursor:pointer}
.total{font-family:var(--font-d);font-size:30px;font-variant-numeric:tabular-nums}
.devfoot{margin-top:8px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.devfoot .dl{display:flex;gap:16px;align-items:center;flex-wrap:wrap;min-width:0;flex:1 1 320px}
.devfoot img{border-radius:12px;display:block;max-width:100%;height:auto}
.devfoot .tg{font-size:14px;color:var(--muted);max-width:52ch}
.devfoot .mail{font-variant-numeric:tabular-nums;user-select:all;overflow-wrap:anywhere;font-weight:500}
@media (prefers-reduced-motion:no-preference){.tab,.btn{transition:background .15s,transform .1s}.btn:active{transform:scale(.98)}}
</style>

  S.access.filter(a=>a.res!=='denied'&&(a.sede||sd)===sd&&a.ts>=lim&&dateOfTs(a.ts)===t).sort((a,b)=>a.ts-b.ts).forEach(a=>{last[a.mid]=a});

function exitMember(m){S.access.push({id:uid(),mid:m.id,ts:Date.now(),method:'salida',res:'ok',why:'',sede:curSede(),type:'out'});save()}
function resolve(method,val){
  const v=String(val||'').trim();if(!v)return null;
  const u=v.toUpperCase(),dg=v.replace(/\D/g,'');
  const F={qr:m=>code(m)===u||code(m)==='MI-'+u,nfc:m=>(m.nfcId||'').toUpperCase()===u,huella:m=>(m.fingerId||'').toUpperCase()===u,dni:m=>!!dg&&m.dni===dg};
  const order=method==='auto'?['qr','nfc','huella','dni']:[method];
  for(let i=0;i<order.length;i++){const k=order[i],m=S.members.find(F[k]);if(m)return {m:m,method:k}}
  if(method==='auto'||method==='nfc'){const st=S.staff.find(x=>x.nfc.toUpperCase()===u||(method==='auto'&&x.pin===v));if(st)return {staff:st,method:'nfc'}}
  return null;
}
function processAccess(m,method){
  const t=todayStr(),st=status(m),pl=planOf(m),sd=curSede(),g=+S.settings.grace||0;
  const last=S.access.filter(a=>a.mid===m.id&&a.type!=='out').sort((a,b)=>b.ts-a.ts)[0];
  if(last&&Date.now()-last.ts<6000&&ui.accRes&&ui.accRes.mid===m.id)return ui.accRes;
  const warns=[],notes=[];let res='ok',why='';
  if(!m.active){res='denied';why='Dado de baja'}
  else if(isFrozen(m)){res='denied';why='Membresía congelada hasta el '+dmy(m.freeze.until)+(m.freeze.reason?' ('+m.freeze.reason+')':'')}
  else if(m.nuevo&&m.due<t){res='denied';why='Pendiente de primer pago'}
  else if(m.due<t){const d=daysBetween(m.due,t);if(d<=g)warns.push('Período de gracia: venció hace '+d+(d===1?' día':' días')+', le '+(g-d===1?'queda 1 día':'quedan '+(g-d)+' días'));else{res='denied';why='Cuota vencida desde el '+dmy(m.due)}}
  else if(S.settings.blockDebt&&m.debt>S.settings.creditLimit){res='denied';why='Deuda de buffet sobre el límite'}
  if(res!=='denied'&&multiSede()&&m.sede&&m.sede!==sd&&!pl.multi){res='denied';why='Su membresía es solo para '+sedeName(m.sede)}
  if(res!=='denied'){
    if(st.k==='warn'&&m.due>=t)warns.push(m.due===t?'Su cuota vence hoy':'Su cuota vence el '+dmy(m.due));
    if(pl.weekly&&!attToday(m.id)&&weekCount(m.id)>=pl.weekly)warns.push('Ya completó sus '+pl.weekly+' sesiones de la semana');
    if(!m.decl)warns.push('Falta la declaración de salud');
    if(m.debt>0)warns.push('Deuda de buffet: '+money(m.debt));
    const cap=+S.settings.capacity||0;if(cap&&insideNow().length>=cap)warns.push('Aforo completo: '+cap+' personas adentro');
    if(warns.length)res='warn';
  }
  if(isBirthday(m))notes.push('Hoy es su cumpleaños');
  if(res!=='denied'&&attToday(m.id))notes.push('Ya había ingresado hoy');
  const k=streak(m.id);if(res!=='denied'&&k>=3)notes.push('Racha de '+k+' semanas seguidas entrenando');
  if(res!=='denied'&&S.settings.autoReg)recordAttendance(m,method);
  S.access.push({id:uid(),mid:m.id,ts:Date.now(),method:method,res:res,why:why||warns.join(' · '),sede:sd,type:'in'});
  if(method==='manual')audit('Ingreso manual',m.name+' · '+(res==='denied'?'denegado':'autorizado'));
  save();beep(res==='ok'?'ok':res==='warn'?'warn':'bad');
  return {mid:m.id,res:res,why:why,warns:warns,notes:notes,method:method,at:Date.now()};
}

}
function showAccess(r){
  ui.accRes=r;refreshAcc();clearTimeout(showAccess.t);
  showAccess.t=setTimeout(()=>{ui.accRes=null;refreshAcc()},7000);
}
function simulate(kind){
  const t=todayStr(),sd=S.settings.alertDays,g=+S.settings.grace||0,cs=curSede();
  const here=m=>!multiSede()||m.sede===cs||planOf(m).multi;
  const A=S.members.filter(m=>m.active&&!isFrozen(m)&&!m.nuevo);
  let pool=A.filter(m=>here(m)&&m.due>addDays(t,sd));
  if(kind==='warn')pool=A.filter(m=>here(m)&&m.due>=t&&m.due<=addDays(t,sd));
  if(kind==='grace')pool=A.filter(m=>here(m)&&m.due<t&&daysBetween(m.due,t)<=g);
  if(kind==='bad')pool=A.filter(m=>here(m)&&m.due<t&&daysBetween(m.due,t)>g);
  if(kind==='frozen')pool=S.members.filter(m=>m.active&&isFrozen(m));
  if(kind==='sede')pool=A.filter(m=>m.sede!==cs&&!planOf(m).multi&&m.due>=t);
  if(kind==='staff'){const L=S.staff.filter(x=>(x.sede||cs)===cs);if(!L.length){toast('No hay personal en esta sede');return}const st=L[Math.floor(Math.random()*L.length)];showAccess({staff:true,pr:punch(st,'nfc')});return}
  if(!pool.length){toast('No hay socios en esa situación');return}
  const m=pool[Math.floor(Math.random()*pool.length)];
  const meth=ui.accMethod==='auto'?['qr','nfc','huella','dni'][Math.floor(Math.random()*4)]:ui.accMethod;
  showAccess(processAccess(m,meth));
}

function filterMembers(){
  const t=todayStr(),q=ui.q.trim().toLowerCase(),dq=q.replace(/\D/g,'')||'§',sd=S.settings.alertDays,mo=t.slice(5,7);
  let L=S.members.filter(m=>!q||m.name.toLowerCase().includes(q)||m.dni.includes(dq)||code(m).toLowerCase().includes(q)||(m.nfcId||'').toLowerCase().includes(q));
  if(ui.plan)L=L.filter(m=>m.planId===ui.plan);
  if(ui.msede)L=L.filter(m=>m.sede===ui.msede);
  const f=ui.flt,g=+S.settings.grace||0,rk=f==='riesgo'?segments().reactiva.map(m=>m.id):[];
  if(f==='activos')L=L.filter(m=>m.active);
  else if(f==='aldia')L=L.filter(m=>m.active&&m.due>addDays(t,sd));
  else if(f==='porvencer')L=L.filter(m=>m.active&&m.due>=t&&m.due<=addDays(t,sd));
  else if(f==='vencidos')L=L.filter(m=>m.active&&m.due<t);
  else if(f==='gracia')L=L.filter(m=>m.active&&!m.nuevo&&m.due<t&&daysBetween(m.due,t)<=g);
  else if(f==='congelados')L=L.filter(m=>m.active&&isFrozen(m));
  else if(f==='riesgo')L=L.filter(m=>rk.indexOf(m.id)>=0);
  else if(f==='sinrutina')L=L.filter(m=>m.active&&!latestRoutine(m.id));
  else if(f==='baja')L=L.filter(m=>!m.active);
  else if(f==='cumple')L=L.filter(m=>m.active&&m.birth&&m.birth.slice(5,7)===mo);
  else if(f==='deuda')L=L.filter(m=>m.debt>0);
  else if(f==='sindecl')L=L.filter(m=>m.active&&!m.decl);
  return L.sort((a,b)=>a.name.localeCompare(b.name,'es'));
}

function sellCart(){
  if(!ui.cart.length){toast('Agregá productos a la venta');return}
  const total=cartTotal(),buyer=ui.posMid?mem(ui.posMid):null,t=todayStr();
  if(ui.posMethod==='Cuenta corriente'){
    if(!buyer){toast('Elegí un cliente para cargar a cuenta corriente');return}
    if(buyer.due<t){toast('Cuota vencida: no se puede cargar a cuenta corriente');return}
    if(buyer.debt+total>S.settings.creditLimit){toast('Supera el límite de crédito de '+money(S.settings.creditLimit));return}
  }
  const items=ui.cart.map(c=>{const p=S.products.find(x=>x.id===c.pid);p.stock-=c.qty;return {pid:p.id,name:p.name,qty:c.qty,price:p.price,cost:p.cost}});
  S.sales.push({id:uid(),date:t,ts:Date.now(),mid:buyer?buyer.id:'',items:items,total:total,method:ui.posMethod});
  if(ui.posMethod==='Cuenta corriente')buyer.debt+=total;
  if(buyer)addStamp(buyer,t);
  newInvoice({mid:buyer?buyer.id:'',concept:'Venta de buffet',total:total,method:ui.posMethod});
  save();ui.cart=[];ui.posMid='';ui.posMethod='Efectivo';render();toast('Venta registrada por '+money(total));
}

function ivaSplit(total){return S.settings.iva==='Responsable Inscripto'?{neto:total/1.21,iva:total-total/1.21}:{neto:total,iva:0}}
function cobros(){
  const act=S.members.filter(m=>m.active),t=todayStr();
  const sel=ui.payMid&&mem(ui.payMid)?ui.payMid:(act[0]?act[0].id:''),m0=mem(sel);
  const todayPay=S.payments.filter(p=>validPay(p)&&p.date===t),byM={};

function noticeTargets(tg){
  const t=todayStr(),A=S.members.filter(m=>m.active);
  if(!tg||tg==='all')return A;
  if(tg==='vencidos')return A.filter(m=>m.due<t);
  const k=tg.split(':')[0],v=tg.split(':')[1];
  if(k==='plan')return A.filter(m=>m.planId===v);
  if(k==='sede')return A.filter(m=>m.sede===v||planOf(m).multi);
  if(k==='class'){const ids=new Set(S.res.filter(r=>r.cid===v).map(r=>r.mid).concat(S.classAtt.filter(a=>a.cid===v).map(a=>a.mid)));return A.filter(m=>ids.has(m.id))}
  return A;
}
function targetLabel(tg){
  if(!tg||tg==='all')return 'Todos los socios activos';if(tg==='vencidos')return 'Con cuota vencida';
  const k=tg.split(':')[0],v=tg.split(':')[1];
  if(k==='plan'){const p=S.plans.find(x=>x.id===v);return 'Membresía '+(p?p.name:'')}
  if(k==='sede')return sedeName(v);
  if(k==='class'){const c=S.classes.find(x=>x.id===v);return c?'Clase '+c.name+' '+DAYS7[c.day]+' '+c.time:'Clase'}
  return tg;
}

function hoursOf(sid,from,to){
  const L=S.clock.filter(c=>c.sid===sid&&c.date>=from&&(!to||c.date<=to)).sort((a,b)=>a.ts-b.ts);let h=0,open=null;
  L.forEach(c=>{if(c.type==='in')open=c;else if(open&&open.date===c.date){h+=(c.ts-open.ts)/36e5;open=null}});return h;
}
function payroll(ms){
  return S.staff.map(s=>{
    const h=hoursOf(s.id,ms),runs={};
    S.classAtt.forEach(a=>{const c=S.classes.find(x=>x.id===a.cid);if(c&&c.trainerId===s.id&&a.date>=ms)runs[a.cid+'|'+a.date]=1});
    const nc=Object.keys(runs).length,pt=S.payments.filter(p=>validPay(p)&&p.kind==='cuota'&&p.date>=ms&&mem(p.mid)&&mem(p.mid).trainerId===s.id).reduce((a,p)=>a+p.total,0);
    const base=h*s.rate,cc=nc*s.commClass,cp=pt*s.commPT/100;
    return {s:s,h:h,nc:nc,pt:pt,base:base,cc:cc,cp:cp,total:base+cc+cp};
  });
}

function punch(s,method){
  const now=Date.now(),last=S.clock.filter(c=>c.sid===s.id).sort((a,b)=>b.ts-a.ts)[0];
  if(last&&now-last.ts<60000)return {ok:false,name:s.name,msg:'Pasaron menos de 60 segundos desde el último fichaje.'};
  const type=(last&&last.type==='in'&&last.date===todayStr())?'out':'in';
  S.clock.push({id:uid(),sid:s.id,ts:now,date:todayStr(),type:type,method:method});save();
  return {ok:true,type:type,name:s.name,msg:hhmm(now)+' · '+(method==='nfc'?'NFC':'PIN')};
}

function lineChart(L,key,unit){
  const pts=L.filter(x=>x[key]!=null&&x[key]!=='').map(x=>({d:x.date,v:+x[key]}));if(pts.length<2)return '';
  const W_=520,H=160,pl=36,pr=14,pt=24,pb=26,mn=Math.min(...pts.map(p=>p.v)),mx=Math.max(...pts.map(p=>p.v)),rg=(mx-mn)||1;
  const X=i=>pl+i*(W_-pl-pr)/(pts.length-1),Y=v=>pt+(1-(v-mn)/rg)*(H-pt-pb);
  return '<svg viewBox="0 0 '+W_+' '+H+'" width="100%" role="img" aria-label="Evolución de '+esc(key)+'" style="display:block;max-width:100%">'+

  if(k==='mediciones'){const R_=[['Socio','Documento','Fecha'].concat(MEAS.map(x=>x[1]+' ('+x[2]+')'))];S.members.forEach(m=>(m.measures||[]).forEach(x=>R_.push([m.name,m.dni,x.date].concat(MEAS.map(k=>x[k[0]]==null?'':x[k[0]])))));return csv(R_)}
  if(k==='maquinas')return csv([['Máquina','Zona','Sede','Estado','Último mantenimiento','Próximo','Notas']].concat(S.machines.map(q=>[q.name,q.zone,sedeName(q.sede),q.state==='ok'?'Operativa':'En reparación',q.last,nextMaint(q),q.notes])));
  if(k==='auditoria')return csv([['Fecha','Hora','Rol','Acción','Detalle']].concat((S.audit||[]).slice().sort((a,b)=>a.ts-b.ts).map(a=>[dateOfTs(a.ts),hhmm(a.ts),ROLES[a.role]||a.role,a.act,a.detail])));
  if(k==='ventas')return csv([['Fecha','N° interno','Tipo de documento','Documento','Cliente','Concepto','Neto','IVA','Total','Medio de pago','N° ARCA','CAE']].concat(S.invoices.map(i=>{const m=mem(i.mid),sp=ivaSplit(i.total);return [i.date,i.n,m&&m.dni?'DNI':'Consumidor final',m?m.dni:'',m?m.name:'Consumidor final',i.concept,sp.neto.toFixed(2),sp.iva.toFixed(2),i.total,i.method,i.arca?i.arca.num:'',i.arca?i.arca.cae:'']})));
  if(k==='gastos')return csv([['Fecha','Concepto','Categoría','Monto']].concat(S.expenses.map(e=>[e.date,e.concept,e.cat,e.amount])));
  if(k==='fichajes')return csv([['Fecha','Hora','Persona','Tipo','Método']].concat(S.clock.slice().sort((a,b)=>a.ts-b.ts).map(c=>{const s=staffOf(c.sid);return [c.date,hhmm(c.ts),s?s.name:'',c.type==='in'?'Entrada':'Salida',c.method]})));
  return '';
}

const FORMS={
  member(fd){
    const id=fd.get('id'),o={name:fd.get('name').trim(),dni:fd.get('dni').replace(/\D/g,''),phone:fd.get('phone').trim(),birth:fd.get('birth')||'',planId:fd.get('planId'),mode:'presencial',due:fd.get('due'),sede:fd.get('sede')||curSede(),
      nfcId:fd.get('nfcId').trim().toUpperCase(),fingerId:fd.get('fingerId').trim().toUpperCase(),goal:fd.get('goal'),level:fd.get('level'),trainerId:fd.get('trainerId')||'',inj:fd.getAll('inj'),health:fd.get('health').trim(),decl:fd.get('decl')==='on',consent:fd.get('consent')==='on'};
    if(!o.name){toast('Escribí el nombre');return}
    if(o.dni&&S.members.some(m=>m.dni===o.dni&&m.id!==id)){toast('Ya existe un socio con ese documento');return}
    const prevPlan=id?mem(id).planId:'';
    if(id)Object.assign(mem(id),o);else S.members.push(Object.assign({id:uid(),active:true,debt:0,stampDates:[],spent:0,reviewAt:'',created:todayStr(),measures:[],freeze:null},o));
    const m=id?mem(id):S.members[S.members.length-1];
    audit(id?(prevPlan!==o.planId?'Cambio de membresía':'Ficha editada'):'Alta de socio',m.name+(prevPlan!==o.planId?' · '+planOf(m).name:''));
    save();ui.fichaTab='res';ui.modal={t:'ficha',id:m.id};render();toast(id?'Datos actualizados':'Socio agregado. Enviale su app desde la ficha');
  },
  plan(fd){
    const id=fd.get('id'),o={name:fd.get('name').trim(),price:+fd.get('price')||0,weekly:Math.max(0,+fd.get('weekly')||0),kind:fd.get('kind'),desc:fd.get('desc').trim(),multi:multiSede()?fd.get('multi')==='on':true};
    if(!o.name)return;
    const old=id?S.plans.find(p=>p.id===id):null;
    if(old&&old.price!==o.price)audit('Precio actualizado',o.name+': '+money(old.price)+' → '+money(o.price));else if(!old)audit('Membresía creada',o.name+' · '+money(o.price));
    if(id)Object.assign(old,o);else S.plans.push(Object.assign({id:uid()},o));
    save();render();toast(id?'Plan actualizado':'Plan agregado');
  },
  slot(fd){
    const mid=fd.get('mid');if(!mid){toast('Primero cargá un '+W().s);return}
    S.slots.push({id:uid(),mid:mid,day:+fd.get('day'),time:fd.get('time'),mode:fd.get('mode')});save();render();
    const m=mem(mid),n=S.slots.filter(x=>x.mid===mid).length,w=planOf(m).weekly;
    toast(w&&n>w?'Agregado. Ojo: supera las '+w+' sesiones de su plan':'Sesión agregada a la agenda');
  },
  genRt(fd){
    const m=mem(fd.get('mid'));if(!m)return;
    const o={goal:fd.get('goal'),level:fd.get('level'),days:+fd.get('days'),inj:fd.getAll('inj'),sede:m.sede,trend:measureTrend(m),shift:0};
    m.goal=o.goal;m.level=o.level;m.inj=o.inj;ui.rtShift=0;ui.rtMid=m.id;
    ui.rtDraft=Object.assign({mid:m.id,opts:o},genRoutine(o,S.exercises,S.machines));save();render();
  },
  rtEdit(fd){
    const r=S.routines.find(x=>x.id===fd.get('id'));if(!r)return;
    r.name=fd.get('name').trim()||r.name;
    r.days.forEach((d,di)=>{
      d.items=d.items.map((it,ii)=>{const k=di+'_'+ii;if(fd.get('x'+k)==='on')return null;return Object.assign(it,{s:Math.max(1,+fd.get('s'+k)||it.s),r:(fd.get('r'+k)||it.r).trim(),kg:String(fd.get('k'+k)||'').trim().replace('.',',')})}).filter(Boolean);
      const add=fd.get('a'+di);if(add){const P=RT_PRM[r.goal]||RT_PRM.salud,lv=Math.max(0,['principiante','intermedio','avanzado'].indexOf(r.level));d.items.push({ex:add,s:P.s[lv],r:P.r,kg:'',rest:P.rest})}

    const m=mem(r.mid);audit('Rutina editada',(m?m.name:'')+' · '+r.name);r.auto=false;save();ui.modal=null;render();toast('Rutina actualizada');

  exercise(fd){

  },
  machine(fd){
    const id=fd.get('id'),o={name:fd.get('name').trim(),zone:fd.get('zone').trim(),sede:fd.get('sede')||curSede(),last:fd.get('last')||todayStr(),every:Math.max(7,+fd.get('every')||90),video:fd.get('video').trim(),notes:fd.get('notes').trim()};

    else S.machines.push(Object.assign({id:'mq'+uid(),state:'ok',photo:ph||'',log:[]},o));
    audit(id?'Máquina editada':'Máquina agregada',o.name);save();ui.modal=null;render();toast('Máquina guardada');

  },
  newClass(fd){
    const n=fd.get('name').trim();if(!n)return;
    S.classes.push({id:uid(),name:n,day:+fd.get('day'),time:fd.get('time'),cap:Math.max(1,+fd.get('cap')||10),trainerId:fd.get('trainerId')||'',sede:curSede()});
    audit('Clase agregada a la grilla',n+' · '+DAYS7[+fd.get('day')]+' '+fd.get('time'));save();render();toast('Clase agregada');
  },
  freeze(fd){
    const m=mem(fd.get('id'));if(!m)return;const t=todayStr(),n=Math.max(1,+fd.get('days')||15),r=fd.get('reason');
    if(m.due<t){toast('La cuota está vencida: cobrala antes de congelar');return}
    m.freeze={from:t,until:addDays(t,n-1),reason:r};m.due=addDays(m.due,n);
    audit('Membresía congelada',m.name+' · '+n+' días · '+r);save();ui.modal={t:'ficha',id:m.id};render();toast('Congelada hasta el '+dmy(m.freeze.until)+'. Nuevo vencimiento: '+dmy(m.due));
  },
  void(fd){
    const p=S.payments.find(x=>x.id===fd.get('id'));if(!p||p.void)return;const m=mem(p.mid),r=fd.get('reason').trim();
    p.void={ts:Date.now(),role:S.settings.role,reason:r};
    if(p.kind==='cuota'&&m&&m.due===p.until&&p.prev)m.due=p.prev;
    if(p.kind==='deuda'&&m)m.debt+=p.total;
    const i=S.invoices.find(x=>x.id===p.inv);if(i)i.void=true;
    if(ui.lastPay&&ui.lastPay.mid===p.mid)ui.lastPay=null;
    audit('Cobro anulado',(m?m.name:'')+' · '+money(p.total)+' · '+r);save();ui.modal=null;render();toast('Cobro anulado'+(m&&p.kind==='cuota'?'. Paga hasta '+dmy(m.due):''));
  },
  import(fd){
    const rows=String(fd.get('t')||'').split(/\r?\n/).map(l=>l.split(/\t|;|,/).map(x=>x.trim())).filter(r=>r[0]&&r[0].length>2&&!/^nombre$/i.test(r[0]));
    let ok=0,skip=0;
    rows.forEach(r=>{
      const dni=(r[1]||'').replace(/\D/g,'');if(dni&&S.members.some(m=>m.dni===dni)){skip++;return}
      const pl=S.plans.find(p=>p.name.toLowerCase()===(r[3]||'').toLowerCase())||S.plans[0];let due=todayStr();
      const dm=(r[4]||'').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(dm)due=dm[3]+'-'+pad(+dm[2])+'-'+pad(+dm[1]);
      S.members.push({id:uid(),name:r[0],dni:dni,phone:(r[2]||'').replace(/\D/g,''),email:'',birth:'',planId:pl.id,mode:'presencial',due:due,active:true,goal:'salud',level:'principiante',inj:[],health:'',decl:false,consent:true,nfcId:'',fingerId:'',debt:0,stampDates:[],spent:0,reviewAt:'',created:todayStr(),trainerId:'',sede:curSede(),measures:[],freeze:null});ok++;
    });
    audit('Importación de planilla',ok+' socios nuevos · '+skip+' repetidos');save();ui.modal=null;render();toast(ok+' socios importados'+(skip?' · '+skip+' ya existían':''));
  },
  notice(fd){
    const n={id:uid(),ts:Date.now(),title:fd.get('title').trim(),body:fd.get('body').trim(),target:fd.get('target'),count:0};if(!n.title||!n.body)return;
    n.count=noticeTargets(n.target).length;S.notices.push(n);audit('Aviso creado',n.title+' · '+targetLabel(n.target));save();ui.modal={t:'notice',id:n.id};render();
  },
  measure(fd){
    const m=mem(fd.get('mid'));if(!m)return;const o={date:fd.get('date')||todayStr()};let any=false;
    MEAS.forEach(k=>{const v=String(fd.get(k[0])||'').replace(',','.').trim();if(v!==''&&!isNaN(+v)){o[k[0]]=+v;any=true}});
    if(!any){toast('Cargá al menos una medida');return}
    m.measures=(m.measures||[]).filter(x=>x.date!==o.date);m.measures.push(o);m.measures.sort((a,b)=>a.date.localeCompare(b.date));save();render();toast('Medición guardada');
  },
  brand(fd){S.settings.accent=fd.get('accent')||'';audit('Marca actualizada','Color '+S.settings.accent);save();render();toast('Color aplicado')},
  sedes(fd){
    const L=String(fd.get('sedes')||'').split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(a=>a[0]);if(!L.length){toast('Tiene que haber al menos una sede');return}
    const old=sedes(),nw=L.map((a,i)=>({id:old[i]?old[i].id:'s'+uid(),name:a[0],addr:a[1]||''}));
    const ids=nw.map(x=>x.id),fb=nw[0].id;
    S.members.forEach(m=>{if(ids.indexOf(m.sede)<0)m.sede=fb});S.classes.forEach(c=>{if(ids.indexOf(c.sede)<0)c.sede=fb});S.machines.forEach(q=>{if(ids.indexOf(q.sede)<0)q.sede=fb});S.staff.forEach(x=>{if(ids.indexOf(x.sede)<0)x.sede=fb});
    S.settings.sedes=nw;if(ids.indexOf(S.settings.sede)<0)S.settings.sede=fb;audit('Sedes actualizadas',nw.map(x=>x.name).join(', '));save();render();toast('Sedes guardadas');
  },
  pay(fd){
    const mid=fd.get('mid');if(!mid){toast('Primero cargá un '+W().s);return}
    const a1=Math.max(0,+fd.get('a1')||0),a2=Math.max(0,+fd.get('a2')||0);
    if(a1+a2<=0){toast('Ingresá un monto mayor a cero');return}
    const until=registerPayment(mid,[{m:fd.get('m1'),a:a1}].concat(a2>0?[{m:fd.get('m2'),a:a2}]:[]));
    ui.payMid='';render();toast('Cobro registrado. Cuota paga hasta '+dmy(until));
  },
  acc(fd){
    const q=String(fd.get('q')||'').trim();if(!q)return;
    const r=resolve(ui.accMethod,q);
    if(r&&r.staff)showAccess({staff:true,pr:punch(r.staff,/^\d+$/.test(q)?'pin':'nfc')});
    else if(r)showAccess(processAccess(r.m,r.method));else showAccess({nf:true,q:q});
  },
  reserve(fd){
    const c=S.classes.find(x=>x.id===fd.get('cid')),mid=fd.get('mid');if(!c||!mid)return;
    const nd=nextDate(c.day);
    if(S.res.filter(r=>r.cid===c.id&&r.date===nd).length>=c.cap){toast('La clase está completa');return}
    if(S.res.some(r=>r.cid===c.id&&r.date===nd&&r.mid===mid)){toast('Ya tiene lugar en esta clase');return}
    S.res.push({id:uid(),cid:c.id,date:nd,mid:mid});save();render();toast('Reserva confirmada');
  },
  tpl(fd){Object.keys(TPLINFO).forEach(k=>{S.settings.tpl[k]=fd.get(k)});S.settings.reviewUrl=fd.get('url').trim();save();render();toast('Textos guardados')},
  settings(fd){
    const s=S.settings;
    s.biz=fd.get('biz').trim()||s.biz;s.owner=fd.get('owner').trim();s.razon=fd.get('razon').trim();s.cuit=fd.get('cuit').trim();s.pv=(fd.get('pv').replace(/\D/g,'')||'1').padStart(4,'0').slice(-4);s.iva=fd.get('iva');
    s.wa=fd.get('wa').replace(/\D/g,'');s.publicUrl=fd.get('publicUrl').trim()||s.publicUrl;s.address=fd.get('address').trim();s.about=fd.get('about').trim();s.hours=fd.get('hours').trim();
    s.alertDays=Math.min(30,Math.max(1,+fd.get('alertDays')||5));s.creditLimit=Math.max(0,+fd.get('creditLimit')||0);s.autoReg=fd.get('autoReg')==='on';s.blockDebt=fd.get('blockDebt')==='on';
    s.grace=Math.min(15,Math.max(0,+fd.get('grace')||0));s.capacity=Math.max(0,+fd.get('capacity')||0);s.ownerWa=fd.get('ownerWa').replace(/\D/g,'');s.mpLink=fd.get('mpLink').trim();s.alias=fd.get('alias').trim();
    const rw=String(fd.get('rewards')||'').split('\n').map(l=>l.split('|')).filter(a=>a.length>=2&&+a[0]>0&&a[1].trim()).map(a=>{const old=s.rewards.find(r=>r.name===a[1].trim());return {id:old?old.id:uid(),sellos:+a[0],name:a[1].trim()}});
    if(rw.length)s.rewards=rw;
    audit('Ajustes guardados','Gracia '+s.grace+' d · aforo '+s.capacity);save();render();toast('Ajustes guardados');
  },
  restore(fd){try{const o=JSON.parse(fd.get('json'));if(!o||!(o.v>=2)||!Array.isArray(o.members))throw 0;S=o;migrate();save();render();toast('Respaldo restaurado')}catch(e){toast('El texto no es un respaldo válido')}},
  clock(fd){
    const q=String(fd.get('q')||'').trim();if(!q)return;
    const s=S.staff.find(x=>x.pin===q||x.nfc.toUpperCase()===q.toUpperCase());
    ui.clockRes=s?punch(s,/^\d+$/.test(q)?'pin':'nfc'):{ok:false,name:'',msg:'No se reconoce el PIN o la tarjeta.'};render();
  },
  staff(fd){const n=fd.get('name').trim();if(S.staff.some(x=>x.pin===fd.get('pin').trim())){toast('Ese PIN ya lo usa otra persona');return}S.staff.push({id:uid(),name:n,role:fd.get('role').trim(),pin:fd.get('pin').trim(),nfc:'NFC-S'+(S.staff.length+1).toString().padStart(2,'0'),rate:+fd.get('rate')||0,commClass:+fd.get('commClass')||0,commPT:+fd.get('commPT')||0,sede:fd.get('sede')||curSede()});audit('Personal agregado',n);save();render();toast('Persona agregada')},
  expense(fd){S.expenses.push({id:uid(),date:fd.get('date'),concept:fd.get('concept').trim(),cat:fd.get('cat'),amount:+fd.get('amount')||0});save();render();toast('Gasto agregado')},
  cash(fd){
    const t=todayStr();let exp=0;S.payments.filter(p=>validPay(p)&&p.date===t).forEach(p=>p.lines.forEach(l=>{if(l.m==='Efectivo')exp+=l.a}));S.sales.filter(s=>s.date===t&&s.method==='Efectivo').forEach(s=>{exp+=s.total});
    const c=+fd.get('counted')||0;S.cash.push({date:t,expected:exp,counted:c});audit('Cierre de caja','Esperado '+money(exp)+' · contado '+money(c)+' · diferencia '+money(c-exp));save();render();toast('Caja cerrada');
  },
  lead(fd){
    const l=parseLead(fd.get('t'));
    if(!l){toast('No encontré el código de alta en el mensaje');return}
    if(S.leads.some(x=>x.d===l.d)||S.members.some(m=>m.dni===l.d)){toast('Ya existe una solicitud o un '+W().s+' con ese documento');return}
    S.leads.push(Object.assign({id:uid()},l));save();ui.modal=null;render();toast('Solicitud importada: '+l.n);
  },
  arca(fd){const i=S.invoices.find(x=>x.id===fd.get('id'));if(i){i.arca={num:fd.get('num').trim(),cae:fd.get('cae').trim()};save();ui.modal=null;render();toast('Número de ARCA guardado')}}
};
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const h=FORMS[f.dataset.form];if(h)h(new FormData(f));
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){ui.q=e.target.value;ui.page=0;$('#list').innerHTML=memberList()}
});
document.addEventListener('change',e=>{
  const id=e.target.id,v=e.target.value;
  if(id==='flt'){ui.flt=v;ui.page=0;$('#list').innerHTML=memberList()}
  else if(id==='pln'){ui.plan=v;ui.page=0;$('#list').innerHTML=memberList()}
  else if(id==='sede-sel'){S.settings.sede=v;ui.accRes=null;save();render()}
  else if(id==='msd'){ui.msede=v;ui.page=0;$('#list').innerHTML=memberList()}
  else if(id==='rt-flt'){ui.rtMid=v;render()}
  else if(id==='rg-m'){ui.rtMid=v;ui.rtDraft=null;render()}
  else if(id==='s-logo'&&e.target.files[0]){resizeImg(e.target.files[0],160,'image/png',u=>{S.settings.logo=u;audit('Marca actualizada','Logo nuevo');save();render();toast('Logo aplicado')})}
  else if(e.target.dataset&&e.target.dataset.photo&&e.target.files[0]){resizeImg(e.target.files[0],360,'image/jpeg',u=>{const h=$('#mq-ph');if(h)h.value=u;toast('Foto lista: guardá para aplicarla')})}
  else if(id==='p-mid'){const m=mem(v);ui.payMid=v;if(m){render()}}
  else if(id==='role-sel'){S.settings.role=v;save();render()}
  else if(id==='pos-m'){ui.posMid=v;render()}
  else if(id==='pos-pay'){ui.posMethod=v;render()}
});
function resizeImg(file,max,type,cb){
  const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);try{cb(c.toDataURL(type,.82))}catch(e){toast('No se pudo leer la imagen')}};im.onerror=()=>toast('No se pudo leer la imagen');im.src=r.result};r.readAsDataURL(file);
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ui.modal){ui.modal=null;render()}else if(ui.kiosk){A.kioskExit()}}});
setInterval(()=>{const c=$('#k-clock');if(c)c.textContent=hhmm(Date.now())},20000);

try{const th=localStorage.getItem('mi-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
load();render();
})();
</script>

<script>if("serviceWorker"in navigator&&location.protocol.startsWith("http"))addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
