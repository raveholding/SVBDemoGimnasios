<style>
:root{
  --y:#A8E600; --y2:#EEF9CC; --m:#1F8A70; --m2:#D7F2EA;
  --ink:#0B0E09; --bg:#070806; --card:#111410; --card2:#161b13;
  --tx:#ECF3E6; --mut:#9AA593; --line:#262b21;
  --ok:#0F9D58; --warn:#E6C200; --bad:#D92D4B;
  --r:22px;
  --font:Inter,"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 var(--font);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(900px 500px at 12% -10%,rgba(168,230,0,.10),transparent 60%),
  radial-gradient(700px 500px at 100% 110%,rgba(31,138,112,.14),transparent 60%)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:var(--tx);background:#0c0f0a;border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:48px;width:100%;user-select:text;-webkit-user-select:text}
input:focus,select:focus,textarea:focus{outline:2px solid var(--y);outline-offset:1px}
input[type=checkbox]{width:26px;height:26px;min-height:0;accent-color:var(--y)}
input[type=range]{padding:0;accent-color:var(--y)}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px;font-weight:600}
h1,h2,h3{margin:0;letter-spacing:-.02em}
.ic{width:1.25em;height:1.25em;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

#app{position:relative;height:100%;display:flex;flex-direction:column;padding:max(14px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left));gap:14px;z-index:1}
header.bar{display:flex;align-items:center;gap:14px;min-height:64px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.logo{width:52px;height:52px;border-radius:16px;background:#070806;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none;touch-action:none}
.logo img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.brand b{display:block;font-size:19px;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.clock{text-align:right;line-height:1.15}
.clock b{font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.clock small{display:flex;align-items:center;gap:6px;justify-content:flex-end;color:var(--mut);font-size:13px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--mut);display:inline-block}
.dot.on{background:var(--y);box-shadow:0 0 0 4px rgba(168,230,0,.15)}
.dot.off{background:var(--warn)}
.ibtn{width:48px;height:48px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;background:var(--card)}
.ibtn:active{transform:scale(.94);background:var(--card2)}

main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;display:none;animation:in .22s ease}
.view.on{display:flex}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* HOME */
.home{gap:16px}
.hero{flex:1.05;min-width:0;background:linear-gradient(160deg,#10150d,#0a0d08);border:1px solid var(--line);border-radius:28px;padding:28px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-90px;top:-90px;width:320px;height:320px;border:2px solid rgba(168,230,0,.16);border-radius:60px;transform:rotate(18deg)}
.hero .big{width:96px;height:96px;border-radius:28px;background:#070806;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.hero .big img{width:100%;height:100%;object-fit:cover}
.hero h1{font-size:clamp(30px,4.4vw,52px);line-height:1.02;margin:18px 0 10px}
.hero h1 em{font-style:normal;color:var(--y)}
.hero p{color:var(--mut);margin:0;max-width:34ch;font-size:17px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:99px;border:1px solid rgba(168,230,0,.35);background:rgba(168,230,0,.08);color:var(--y);font-weight:700;font-size:14px;width:fit-content}
.infos{display:grid;gap:10px;margin-top:20px}
.info{display:flex;gap:10px;align-items:center;color:var(--mut);font-size:14px}
.info b{color:var(--tx);font-weight:600}
.tiles{flex:1.25;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:14px;min-width:0}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;text-align:left;min-height:96px;position:relative;overflow:hidden;transition:transform .12s,background .12s,border-color .12s}
.tile:active{transform:scale(.97);background:var(--card2)}
.tile .ic{width:34px;height:34px;color:var(--y)}
.tile b{font-size:19px;letter-spacing:-.01em;display:block}
.tile small{color:var(--mut);font-size:13px;display:block;margin-top:2px}
.tile.main{grid-column:1/-1;background:var(--y);border-color:var(--y);color:var(--ink);flex-direction:row;align-items:center;gap:16px}
.tile.main .ic{color:var(--ink);width:48px;height:48px}
.tile.main small{color:rgba(11,14,9,.7)}
.tile.main b{font-size:26px}
.tile.main,.tile.sos,.tile[data-act=staff]{justify-content:flex-start}
.tile.sos{border-color:rgba(217,45,75,.55);background:linear-gradient(160deg,rgba(217,45,75,.14),var(--card))}
.tile.sos .ic{color:#ff6b86}
.tile[disabled]{opacity:.45}
footer.ft{display:flex;gap:14px;align-items:center;justify-content:space-between;color:var(--mut);font-size:12.5px;flex-wrap:wrap}
footer.ft a{color:var(--mut);text-decoration:none;border-bottom:1px dotted var(--line)}
#v_admin .adm{flex:1;width:100%}
.tile[disabled]{opacity:.38;pointer-events:none}
.offb{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:16px;border:1px solid rgba(230,194,0,.5);background:rgba(230,194,0,.08);color:var(--warn);margin-bottom:12px}
.offb b{display:block;font-size:16px}.offb small{display:block;color:var(--mut);font-size:13px;margin-top:2px}

/* panels */
.panel{margin:auto;width:min(560px,100%);max-height:100%;background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.panel.wide{width:min(760px,100%)}
.ph{display:flex;align-items:center;gap:12px}
.ph h2{font-size:24px;flex:1}
.ph p{margin:2px 0 0;color:var(--mut);font-size:14px}
.back{display:flex;align-items:center;gap:8px;padding:10px 16px;border-radius:14px;border:1px solid var(--line);font-weight:600;min-height:48px}
.dots{display:flex;gap:14px;justify-content:center;margin:6px 0}
.dots i{width:18px;height:18px;border-radius:50%;border:2px solid var(--mut);transition:.12s}
.dots i.f{background:var(--y);border-color:var(--y);transform:scale(1.12)}
.dots.err{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.pad button{height:clamp(58px,9.5vh,80px);border-radius:20px;background:var(--card2);border:1px solid var(--line);font-size:28px;font-weight:700;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.pad button:active{background:var(--y);color:var(--ink);transform:scale(.95)}
.pad button.ok{background:var(--y);color:var(--ink)}
.pad button.alt{font-size:18px;color:var(--mut)}
.pad button[disabled]{opacity:.35}
.msg{min-height:22px;text-align:center;color:var(--mut);font-size:14px}
.msg.bad{color:#ff6b86}.msg.ok{color:var(--y)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{min-height:52px;padding:0 20px;border-radius:16px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--card2)}
.btn{text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.y{background:var(--y);color:var(--ink);border-color:var(--y)}
.btn.m{background:var(--m);border-color:var(--m);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px;border-radius:12px}
.btn.ghost{background:none}
.btn[disabled]{opacity:.4;pointer-events:none}
.areas{display:grid;gap:10px}
.area{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;border:1px solid var(--line);background:var(--card2);min-height:64px;text-align:left;width:100%}
.area:active{border-color:var(--y);background:#1a2115}
.area[disabled]{opacity:.45;pointer-events:none}
.area .ic{color:var(--y);width:28px;height:28px}
.area b{display:block;font-size:17px}.area small{color:var(--mut)}
.call{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 0}
.rings{position:relative;width:150px;height:150px;display:grid;place-items:center}
.rings i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--y);opacity:0;animation:ring 2s infinite}
.rings i:nth-child(2){animation-delay:.6s}.rings i:nth-child(3){animation-delay:1.2s}
.rings .core{width:84px;height:84px;border-radius:50%;background:var(--y);color:var(--ink);display:grid;place-items:center;position:relative}
.rings .core .ic{width:38px;height:38px}
@keyframes ring{0%{transform:scale(.55);opacity:.8}100%{transform:scale(1.2);opacity:0}}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(7,8,6,.94);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
.ov.on{display:flex;animation:in .2s}
.ov .box{display:flex;flex-direction:column;align-items:center;gap:16px;max-width:520px;width:100%}
.ov h2{font-size:clamp(28px,5vw,44px)}
.ov p{color:var(--mut);margin:0;font-size:18px}
.ringsvg{width:200px;height:200px;transform:rotate(-90deg)}
.ringsvg circle{fill:none;stroke-width:10;stroke-linecap:round}
.ringsvg .bg{stroke:var(--line)}
.ringsvg .fg{stroke:var(--y);stroke-dasharray:565;stroke-dashoffset:0}
.cnt{font-size:96px;font-weight:800;color:var(--bad);line-height:1;font-variant-numeric:tabular-nums}
.vbox{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:60px;font-size:18px;color:var(--tx)}
.wave{display:flex;gap:5px;align-items:center;height:46px}
.wave i{width:6px;height:10px;border-radius:3px;background:var(--y);animation:wv 1s ease-in-out infinite}
.wave i:nth-child(2n){animation-delay:.2s}.wave i:nth-child(3n){animation-delay:.4s}.wave i:nth-child(5n){animation-delay:.6s}
@keyframes wv{50%{height:44px}}
.wave.off i{animation:none;background:var(--line)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(30px);background:var(--card2);border:1px solid var(--y);color:var(--tx);padding:12px 18px;border-radius:14px;z-index:90;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;font-weight:600}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ADMIN */
.adm{display:flex;gap:14px;height:100%;min-height:0}
.adm nav{width:230px;flex:none;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:10px;display:flex;flex-direction:column;gap:4px;overflow:auto}
.adm nav button{display:flex;gap:10px;align-items:center;padding:12px 12px;border-radius:14px;text-align:left;font-weight:600;color:var(--mut);min-height:48px}
.adm nav button.on{background:var(--y);color:var(--ink)}
.adm .body{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px;overflow:auto}
.adm h3{font-size:22px;margin-bottom:4px}
.adm .sub{color:var(--mut);font-size:14px;margin:0 0 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.card{border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0;background:var(--card2)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px;position:sticky;top:0;background:var(--card)}
tr.crit td{background:rgba(217,45,75,.12)}
.tag{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:700;background:#1b2216;border:1px solid var(--line);white-space:nowrap}
.tag.bad{background:rgba(217,45,75,.18);border-color:var(--bad);color:#ff8aa0}
.tag.ok{background:rgba(168,230,0,.12);border-color:rgba(168,230,0,.5);color:var(--y)}
pre{background:#070806;border:1px solid var(--line);border-radius:14px;padding:14px;overflow:auto;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;color:#cfe3c1;max-height:360px;user-select:text;-webkit-user-select:text;margin:8px 0}
.qr{background:#fff;padding:12px;border-radius:16px;width:fit-content}
.qr svg{display:block;width:180px;height:180px}
.sw{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:8px 0}
.mut{color:var(--mut)}

.svb{display:flex;align-items:center;gap:14px;flex-basis:100%;background:linear-gradient(90deg,#0d100b,#12170f);border:1px solid var(--line);border-radius:16px;padding:10px 14px;color:var(--tx)}
.svb .mk{width:48px;height:44px;border-radius:12px;background:#050505;border:1px solid #333;display:flex;align-items:center;justify-content:center;white-space:nowrap;font-weight:900;font-size:15px;letter-spacing:.04em;color:#fff;flex:none}
.svb .mk i{font-style:normal;color:var(--y)}
.svb .tx{flex:1;min-width:0;line-height:1.25}
.svb .tx b{display:block;font-size:14px}
.svb .tx span{color:var(--mut);font-size:12px}
.svb .ct{display:flex;gap:8px;flex-wrap:wrap}
.svb .ct a{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--tx);text-decoration:none;font-weight:600;font-size:13px}
.svb .ct a.wa{background:var(--y);border-color:var(--y);color:var(--ink)}
@media (max-width:860px){.svb{flex-wrap:wrap}.svb .ct{width:100%}}
@media (max-width:860px){
  .home{flex-direction:column;overflow:auto}
  .hero{flex:none;padding:20px}.hero .big{width:70px;height:70px}.hero h1{font-size:30px}.infos{display:none}
  .tiles{flex:none;grid-auto-rows:minmax(110px,auto)}
  .clock b{font-size:20px}
  .adm{flex-direction:column}.adm nav{width:auto;flex-direction:row;overflow-x:auto}.adm nav button{white-space:nowrap}
  .grid2{grid-template-columns:1fr}
}
@media (max-height:640px) and (min-width:861px){
  .pad button{height:52px;font-size:22px}.hero{padding:18px}.hero h1{font-size:30px}
}
body{-webkit-touch-callout:none}
.brand>div:last-child{min-width:0}
@media (max-width:860px){
  html,body{height:auto;min-height:100%}
  body{overflow-y:auto;overflow-x:hidden}
  #app{height:auto;min-height:100vh;min-height:100dvh}
  main{flex:1 0 auto;min-height:0}
  .view{position:relative;inset:auto}
  .home{overflow:visible}
  .panel{max-height:none}
  .adm{height:auto}.adm .body{overflow:visible}
  #fsBtn{display:none}
  .brand small{display:none}
  .clock b{font-size:22px}
  .tile.main b{font-size:22px}
  .pad button{height:68px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script type="text/plain" id="fw">/*
 * Vincular Business · Portero Digital · Cannabismática
 * Firmware ESP32 (Arduino IDE / PlatformIO) — control de cerradura por relé
 * Placa: ESP32 DevKit · Relé: GPIO 26 · Pulsador de salida opcional: GPIO 27
 */
#include <WiFi.h>
#include <WebServer.h>

const char* WIFI_SSID  = "TU_WIFI";
const char* WIFI_PASS  = "TU_CLAVE";
const char* TOKEN      = "CAMBIAR_ESTE_TOKEN";   // mismo valor que en Admin > Relé
const int   RELAY_PIN  = 26;
const bool  ACTIVE_LOW = true;                   // true para módulos de relé comunes
const int   EXIT_BTN   = 27;                     // pulsador interno (a GND)
const int   LED_ALERT  = 2;                      // LED de alerta silenciosa
const unsigned long MAX_MS = 10000;              // tope de seguridad

WebServer server(80);
unsigned long relayOffAt = 0;

void relay(bool on) { digitalWrite(RELAY_PIN, (on ^ ACTIVE_LOW) ? HIGH : LOW); }

void cors() {
  server.sendHeader("Access-Control-Allow-Origin", "*");
  server.sendHeader("Access-Control-Allow-Private-Network", "true");
}

bool auth() { return server.hasArg("token") && server.arg("token") == TOKEN; }

void handleOpen() {
  cors();
  if (!auth()) { server.send(403, "text/plain", "forbidden"); return; }
  unsigned long ms = server.hasArg("ms") ? server.arg("ms").toInt() : 3000;
  ms = constrain(ms, 100, MAX_MS);
  relay(true);
  relayOffAt = millis() + ms;
  server.send(200, "application/json", "{\"ok\":true,\"ms\":" + String(ms) + "}");
}

void handleSilent() {            // alerta de coacción: no hace ruido, solo LED oculto
  cors();
  if (!auth()) { server.send(403, "text/plain", "forbidden"); return; }
  digitalWrite(LED_ALERT, HIGH);
  server.send(200, "application/json", "{\"ok\":true}");
}

void setup() {
  pinMode(RELAY_PIN, OUTPUT); relay(false);
  pinMode(EXIT_BTN, INPUT_PULLUP);
  pinMode(LED_ALERT, OUTPUT);
  WiFi.mode(WIFI_STA);
  WiFi.begin(WIFI_SSID, WIFI_PASS);
  while (WiFi.status() != WL_CONNECTED) delay(300);
  server.on("/open", HTTP_GET, handleOpen);
  server.on("/silent", HTTP_GET, handleSilent);
  server.begin();
}

void loop() {
  server.handleClient();
  if (relayOffAt && (long)(millis() - relayOffAt) >= 0) { relay(false); relayOffAt = 0; }
  if (digitalRead(EXIT_BTN) == LOW) { relay(true); relayOffAt = millis() + 3000; delay(300); }
}
</script>

      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);

      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {

      if (_dataCache == null) {

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

    var getBestMaskPattern = function() {

      var pattern = 0;

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {

          pattern = i;

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              } else {

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {

      for (var i = 0; i < 18; i += 1) {

    var setupTypeInfo = function(test, maskPattern) {

          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;

      var row = _moduleCount - 1;

      var byteIndex = 0;

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

              var mask = maskFunc(row, col - c);

                byteIndex += 1;
                bitIndex = 7;
              }

            inc = -inc;

        buffer.put(PAD0, 8);

        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);

      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';

      var max = size - margin;

        '█ ': '▀',

    _this.createASCII = function(cellSize, margin) {

      cellSize -= 1;

      var max = size - margin;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

        }

/* Franjas por día. Si "hasta" <= "desde" la franja cruza la medianoche (00:00 a 00:00 = 24 h). */
function schedActive(d=new Date()){
  const m=d.getHours()*60+d.getMinutes(),day=d.getDay(),prev=(day+6)%7;
  const hit=(list,over)=>(list||[]).some(r=>{const f=tm(r.from),t=tm(r.to);if(f<t)return !over&&m>=f&&m<t;return over?m<t:m>=f});
  return hit(S.sched[day],false)||hit(S.sched[prev],true);
}

  order.forEach(d=>{const l=S.sched[d]||[];if(!l.length)return;const k=l.map(r=>r.from===r.to?'24 h':r.from+' a '+r.to+' h').join(' y ');(g[k]=g[k]||[]).push(d)});
  const parts=Object.entries(g).map(([k,ds])=>{const idx=ds.map(d=>order.indexOf(d));const cons=idx.every((v,i)=>i===0||v===idx[i-1]+1);

async function pkRegister(u,attach){
  const ch=crypto.getRandomValues(new Uint8Array(32));
  const cred=await navigator.credentials.create({publicKey:{
    rp:{name:S.brand,id:location.hostname},
    user:{id:new TextEncoder().encode(u.id),name:u.name,displayName:u.name},
    challenge:ch,pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    excludeCredentials:(u.pk||[]).map(k=>({type:'public-key',id:b64u.dec(k.id)})),
    authenticatorSelection:{authenticatorAttachment:attach,residentKey:'required',requireResidentKey:true,userVerification:'required'},
    attestation:'none',timeout:120000}});
  const r=cred.response,pub=r.getPublicKey&&r.getPublicKey();
  if(!pub)throw new Error('Este navegador no permite leer la clave pública');
  u.pk=(u.pk||[]).concat({id:b64u.enc(cred.rawId),pub:b64u.enc(pub),alg:r.getPublicKeyAlgorithm?r.getPublicKeyAlgorithm():-7,kind:attach==='platform'?'Dispositivo':'Celular',ts:now()});
}
function derToRaw(d){
  let o=2;if(d[1]&0x80)o+=d[1]&0x7f;
  const rl=d[o+1],r=d.slice(o+2,o+2+rl);o=o+2+rl;const sl=d[o+1],s=d.slice(o+2,o+2+sl);
  const fix=x=>{while(x.length>32&&x[0]===0)x=x.slice(1);const out=new Uint8Array(32);out.set(x,32-x.length);return out};
  const raw=new Uint8Array(64);raw.set(fix(r),0);raw.set(fix(s),32);return raw;
}
async function verifyAssertion(a,ch,k){
  try{
    const r=a.response,cd=JSON.parse(new TextDecoder().decode(r.clientDataJSON));
    if(cd.type!=='webauthn.get'||cd.challenge!==b64u.enc(ch)||cd.origin!==location.origin)return false;
    const ad=new Uint8Array(r.authenticatorData);
    const rp=new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(location.hostname)));
    for(let i=0;i<32;i++)if(ad[i]!==rp[i])return false;
    if(!(ad[32]&1)||!(ad[32]&4))return false;               // presencia y verificación biométrica obligatorias
    const h=new Uint8Array(await crypto.subtle.digest('SHA-256',r.clientDataJSON));
    const data=new Uint8Array(ad.length+32);data.set(ad);data.set(h,ad.length);
    const spki=b64u.dec(k.pub),sig=new Uint8Array(r.signature);
    if(k.alg===-7){const key=await crypto.subtle.importKey('spki',spki,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);return await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},key,derToRaw(sig),data)}
    const key=await crypto.subtle.importKey('spki',spki,{name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'},false,['verify']);
    return await crypto.subtle.verify('RSASSA-PKCS1-v1_5',key,sig,data);
  }catch(_){return false}
}
async function pkLogin(){
  const ch=crypto.getRandomValues(new Uint8Array(32));
  const a=await navigator.credentials.get({publicKey:{challenge:ch,rpId:location.hostname,userVerification:'required',timeout:60000}});
  const id=b64u.enc(a.rawId),u=USERS.find(x=>(x.pk||[]).some(k=>k.id===id));
  if(!u)return {err:'Passkey no registrada'};
  return (await verifyAssertion(a,ch,u.pk.find(k=>k.id===id)))?{u}:{err:'Firma inválida'};
}

async function faceLoad(){
  if(FA)return FA;
  if(!window.faceapi)await new Promise((res,rej)=>{const s=document.createElement('script');s.src='face/face-api.js';s.onload=res;s.onerror=()=>rej(new Error('Falta la carpeta face/ junto al index.html'));document.head.appendChild(s)});
  const f=window.faceapi;await f.tf.ready();
  try{await Promise.all([f.nets.tinyFaceDetector.loadFromUri('face/model'),f.nets.faceLandmark68TinyNet.loadFromUri('face/model'),f.nets.faceRecognitionNet.loadFromUri('face/model')])}
  catch(_){throw new Error('No se pudieron cargar los modelos de la carpeta face/model')}
  return FA=f;
}
async function camStart(v){
  const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:480}},audio:false});
  FACE.st=st;v.srcObject=st;await v.play();return st;
}
function stopFace(){FACE.run++;if(FACE.st){FACE.st.getTracks().forEach(t=>t.stop());FACE.st=null}}
const fOpts=()=>new FA.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:0.5});
const fdist=(a,b)=>{let s=0;for(let i=0;i<a.length;i++){const d=a[i]-b[i];s+=d*d}return Math.sqrt(s)};
function eyeAR(lm){const p=lm.positions,d=(a,b)=>Math.hypot(p[a].x-p[b].x,p[a].y-p[b].y);const e=i=>(d(i+1,i+5)+d(i+2,i+4))/(2*d(i,i+3));return (e(36)+e(42))/2}
function blinkDet(){const hist=[];let low=false;return ear=>{hist.push(ear);if(hist.length>20)hist.shift();const base=Math.max(...hist);if(base<0.12)return false;if(!low&&ear<base*0.72){low=true;return false}if(low&&ear>base*0.88){low=false;return true}return false}}
const fset=t=>{const e=$('#fstat');if(e)e.textContent=t};
async function faceEnroll(u){
  ov(`<div class="box"><h2>Registrar rostro</h2><p>${esc(u.name)}</p><p id="fstat">Cargando…</p><video id="fvid" playsinline muted autoplay style="width:100%;max-width:420px;border-radius:20px;transform:scaleX(-1);background:#000"></video><button class="btn" data-act="fcancel">Cancelar</button></div>`);
  const run=++FACE.run;
  try{
    const f=await faceLoad();const v=$('#fvid');await camStart(v);
    const out=[],t0=now();let lastAt=0;
    while(FACE.run===run&&out.length<5&&now()-t0<45000){
      const d=await f.detectSingleFace(v,fOpts()).withFaceLandmarks(true).withFaceDescriptor();
      if(FACE.run!==run)return;
      if(d&&d.detection.score>0.7&&d.detection.box.width/v.videoWidth>0.2&&now()-lastAt>600){out.push(Array.from(d.descriptor).map(x=>+x.toFixed(4)));lastAt=now();fset('Capturando '+out.length+' de 5… movés apenas la cabeza')}
      else if(!d)fset('Ubicá el rostro frente a la cámara, con buena luz');
      await sleep(120);
    }
    if(FACE.run!==run)return;
    stopFace();
    if(out.length<5){ov(null);return toast('No se pudo capturar el rostro. Probá con más luz.',3500)}
    u.face={d:out,ts:now()};save();audit('BIO_ENROLL','Rostro registrado · '+u.name,u.name);ov(null);admBody();toast('Rostro registrado');
  }catch(e){stopFace();ov(null);toast('Rostro: '+(e.message||e.name),4500)}
}
async function faceRecognize(){
  const run=++FACE.run,B=S.bio.face;
  try{
    const f=await faceLoad();if(FACE.run!==run)return;
    const v=$('#fvid');await camStart(v);if(FACE.run!==run)return;
    const cands=bioUsers().filter(hasFace),t0=now(),TL=(B.tl||15)*1000,det=blinkDet();
    let streak=0,last=null,blinked=!B.live,seen=0,matched=false;
    fset(B.live?'Mirá a la cámara y parpadeá una vez':'Mirá a la cámara');
    while(FACE.run===run&&VIEW==='face'&&now()-t0<TL){
      const d=await f.detectSingleFace(v,fOpts()).withFaceLandmarks(true).withFaceDescriptor();
      if(FACE.run!==run)return;
      if(!d){streak=0;last=null;await sleep(100);continue}
      seen++;
      if(B.live&&!blinked&&det(eyeAR(d.landmarks)))blinked=true;
      let best=null;for(const u of cands){const m=Math.min(...u.face.d.map(x=>fdist(x,d.descriptor)));if(!best||m<best.m)best={u,m}}FACE.m=best?best.m:null;
      if(best&&best.m<B.thr){if(last===best.u.id)streak++;else{last=best.u.id;streak=1}}else{streak=0;last=null}
      if(streak>=3)matched=true;
      if(streak>=3&&blinked){stopFace();return finishBio(best.u,'Rostro')}
      fset(streak>=3?'Parpadeá para confirmar':best&&best.m<B.thr?'Verificando…':'Mirá a la cámara');
      await sleep(60);
    }
    if(FACE.run===run){stopFace();bioFail(matched&&!blinked?'No se detectó parpadeo (posible foto)':seen>3?'Rostro no reconocido':'No se detectó ningún rostro','BIO_FAIL');if(VIEW==='face')go('staff')}
  }catch(e){stopFace();fset('Error: '+(e.message||e.name));toast('Rostro: '+(e.message||e.name),4500)}
}

function openDoor(who,via,opt={}){
  const ms=S.relayMs;
  if(opt.silent){audit('CRITICAL_DURESS_EVENT','PIN de coacción utilizado en el portero','—',true);webhook({event:'CRITICAL_DURESS_EVENT',brand:S.brand,ts:now()});notify('duress',{title:'🚨 Alerta silenciosa · '+S.brand,body:'Se usó el PIN de coacción en el portero ('+hhmm()+'). Verificar de inmediato.',prio:5});fireRelay(ms,true)}
  else{audit('DOOR_OPEN',via+(who?' · '+who:''),who||'');fireRelay(ms,false)}
  sfx.unlock();
  const C=2*Math.PI*90;
  ov(`<div class="box">
    <svg class="ringsvg" viewBox="0 0 200 200"><circle class="bg" cx="100" cy="100" r="90"/><circle class="fg" cx="100" cy="100" r="90" style="stroke-dasharray:${C};stroke-dashoffset:0;transition:stroke-dashoffset ${ms}ms linear"/></svg>
    <h2>Puerta abierta</h2>
    <p>${who?'Bienvenido/a, '+esc(who):'Bienvenido/a a '+esc(S.brand)}.<br>Empujá la puerta con suavidad.</p>
  </div>`);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{const f=$('#ov .fg');if(f)f.style.strokeDashoffset=C}));
  if(!opt.silent)say(who?`Bienvenido ${who}. Podés pasar.`:'Podés pasar. Bienvenido.');
  clearTimeout(openDoor.t);
  openDoor.t=setTimeout(()=>{ov(null);sfx.lock();go('home')},Math.max(ms,1500));
}

/* ====================== NFC ====================== */
async function startNFC(adminLink){
  if(!('NDEFReader' in window))return;
  try{
    nfcCtl&&nfcCtl.abort();nfcCtl=new AbortController();
    const r=new NDEFReader();await r.scan({signal:nfcCtl.signal});
    r.onreading=async e=>{
      const sn=e.serialNumber||'';
      if(adminLink){adminLink(sn);return}
      const u=USERS.find(x=>x.on&&x.nfc&&x.nfc===sn);
      if(u&&offBlocked(u)){audit('OFFHOURS_DENIED','NFC fuera de servicio · '+u.name,u.name);sfx.bad();const m=$('#nfcmsg');if(m)m.textContent='Portero fuera de servicio.'}
      else if(u){audit('NFC_OK','Tarjeta '+sn,u.name);sfx.ok();openDoor(u.name,'NFC')}
      else{audit('NFC_FAIL','Tarjeta no registrada '+sn);sfx.bad();const m=$('#nfcmsg');if(m)m.textContent='Tarjeta no registrada.'}
    };
  }catch(e){const m=$('#nfcmsg');if(m)m.textContent='No se pudo iniciar NFC: '+e.message;if(adminLink)toast('NFC: '+e.message)}
}

/* ====================== PIN / pases ====================== */
async function submitKP(){
  const code=KP.buf;if(code.length<KP.min)return;
  if(KP.mode==='admin'){
    if(await sha(code)===SEC.admin){audit('ADMIN_LOGIN','Acceso al panel');sfx.ok();go('admin')}
    else{audit('ADMIN_FAIL','PIN admin incorrecto');kpErr('PIN incorrecto')}
    return;
  }
  if(lockLeft()>0)return;
  if(KP.mode==='pass'){return redeemPass(code)}
  const h=await sha(code);
  if(h===SEC.duress){FAIL={n:0,until:0};LS.set('cnb_fail',FAIL);return openDoor('','PIN',{silent:true})}
  const u=USERS.find(x=>x.on&&x.pin===h);
  if(u&&offBlocked(u)){audit('OFFHOURS_DENIED','PIN fuera de servicio · '+u.name,u.name);sfx.bad();KP.buf='';KP.msg='Portero fuera de servicio';KP.cls='bad';return R.keypad($('#v_keypad'))}
  if(u){FAIL={n:0,until:0};LS.set('cnb_fail',FAIL);audit('DOOR_OPEN','PIN · '+u.name,u.name);return openDoor(u.name,'PIN')}
  failOne('PIN incorrecto','PIN_FAIL');
}
function failOne(msg,type){
  FAIL.n++;audit(type,'Intento fallido #'+FAIL.n);
  const max=S.mode==='corp'?Math.min(3,S.maxFails):S.maxFails;
  if(FAIL.n>=max){const sec=S.mode==='corp'?Math.max(60,S.lockSec):S.lockSec;FAIL={n:0,until:now()+sec*1000};audit('LOCKOUT','Bloqueo '+sec+' s por intentos fallidos',' ',true);notify('lock',{title:'⚠️ Intentos fallidos · '+S.brand,body:'El teclado del portero se bloqueó por demasiados intentos ('+hhmm()+').',prio:4});msg='Demasiados intentos'}
  LS.set('cnb_fail',FAIL);kpErr(msg);
}
function kpErr(msg){
  sfx.bad();KP.buf='';KP.msg=msg;KP.cls='bad';
  const d=$('#kdots');if(d){d.classList.add('err');setTimeout(()=>{if(VIEW==='keypad'||VIEW==='pass')R.keypad($('#v_keypad'))},420)}
  else R.keypad($('#v_keypad'));
}
function redeemPass(code){
  if(!isEnabled()){audit('OFFHOURS_DENIED','Pase fuera de servicio');return kpErr('Portero fuera de servicio')}
  const p=PASSES.find(x=>x.code===code);
  if(!p){audit('PASS_DENIED','Código inexistente');return failOne('Código inválido','PASS_DENIED')}

  if(p.used>=p.max){audit('PASS_DENIED','Pase agotado · '+p.name);return kpErr('Pase ya utilizado')}

}

let sosT=null;
function sosCountdown(kind){

  draw();sfx.beep();say('Llamando a emergencias en 3 segundos. Tocá cancelar si fue un error.');
  clearInterval(sosT);sosT=setInterval(()=>{n--;if(n>0){draw();sfx.beep()}else{clearInterval(sosT);ov(null);dial(kind)}},1000);

function dial(kind){

  if(aux){audit('EMERGENCY_WA','WhatsApp de auxilio a '+(S.trustName||S.trustNum),'',true);
    if(navigator.geolocation)navigator.geolocation.getCurrentPosition(p=>{const a=$('#auxwa');if(a)a.href=waUrl(' Ubicación: https://maps.google.com/?q='+p.coords.latitude+','+p.coords.longitude)},()=>{},{timeout:4000});

const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,listening=false;
function voiceOverlay(){
  ov(`<div class="box">
   <h2>Asistente de voz</h2>
   <div class="wave ${SR?'':'off'}" id="wave">${'<i></i>'.repeat(14)}</div>
   <div class="vbox" id="vtxt">${SR?'Escuchando… probá decir “abrir puerta”, “tocar timbre”, “horarios” o “emergencia”.':'Tu navegador no tiene reconocimiento de voz. Escribí el comando abajo.'}</div>
   <div class="row" style="width:100%"><input id="vin" placeholder="o escribí un comando…" autocomplete="off" style="flex:1"><button class="btn y" data-act="vsend">Enviar</button></div>
   <button class="btn" data-act="vclose">${ic('x')} Cerrar</button></div>`);
  if(SR)startRec();
}
function startRec(){
  try{
    rec=new SR();rec.lang='es-AR';rec.continuous=true;rec.interimResults=false;
    rec.onresult=e=>{for(let i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)handleVoice(e.results[i][0].transcript)};
    rec.onend=()=>{if(listening){try{rec.start()}catch(_){}}};
    rec.onerror=ev=>{if(ev.error==='not-allowed'||ev.error==='service-not-allowed'){listening=false;const t=$('#vtxt');if(t)t.textContent='No hay permiso de micrófono. Podés escribir el comando.';const w=$('#wave');w&&w.classList.add('off')}};
    listening=true;rec.start();
  }catch(_){listening=false}
}
function stopRec(){listening=false;try{rec&&rec.stop()}catch(_){}rec=null}
function handleVoice(raw,fromText){
  let t=norm(raw);if(!t)return;
  const w=norm(S.voice.wake);
  if(S.voice.wakeReq&&!fromText){if(!t.includes(w))return}
  if(w)t=t.replace(w,'').trim();
  const box=$('#vtxt');if(box)box.textContent='“'+raw+'”';
  audit('VOICE_CMD',raw);
  const reply=(m,fn)=>{say(m);if(box)box.textContent='“'+raw+'” → '+m;if(fn)setTimeout(()=>{stopRec();ov(null);fn()},m?1200:0)};
  if(/(911|emergencia|auxilio|socorro|policia|ayuda urgente)/.test(t))return reply('Activando emergencia.',()=>{go('sos');sosCountdown('911')});
  if(/camara/.test(t))return reply('Este portero no usa cámaras. Tu privacidad está resguardada.');
  if(/(abrir|abri|abre|entrar|ingresar).*(puerta|portón|porton)|^abrir$|puerta/.test(t))return reply('Ingresá tu PIN en el teclado.',()=>startKeypad({}));
  if(/(pase|invitacion|visita con)/.test(t))return reply('Ingresá el código de tu pase.',()=>go('pass'));
  if(/(horario|atienden|abierto|a que hora)/.test(t))return reply('Horario del portero: '+hoursTxt().replace(/ · /g,', ')+'.');
  if(/(donde|direccion|ubicacion)/.test(t))return reply('Estamos en '+S.addr+'.');
  const ar=AREAS.find(a=>{const n=norm(a.name).split(' ').filter(x=>x.length>3);return n.some(x=>t.includes(x.slice(0,5)))});
  if(/(timbre|llamar|tocar|avisar|buscar|busco)/.test(t)||ar){if(ar)return reply('Llamando a '+ar.name+'.',()=>ringArea(ar.id));return reply('Elegí a quién buscás.',()=>A.bell())}
  if(/(ayuda|que puedo|comandos)/.test(t))return reply('Podés decir: abrir puerta, tocar timbre, horarios, pase de visita o emergencia.');
  reply('No te entendí. Probá con abrir puerta, tocar timbre u horarios.');
}

 portero(){const u=qrUrl();return `<h3>Timbre por QR desde el celular del visitante</h3><p class="sub">Pegá este QR (y un sticker NFC) en la puerta. El visitante lo escanea con su celular, elige el área y toca el timbre: suena en este dispositivo, les llega el aviso al personal y la respuesta aparece en la pantalla del visitante. Fuera de horario, el visitante ve el horario de atención.</p>
  <div class="card">${sw('Timbre por QR activo en este dispositivo','qr.on')}
   <div class="row" style="margin-top:8px"><span id="qrst" class="tag ${qrState==='ok'?'ok':S.qr.on?'':'bad'}">${qrState==='ok'?'Activo: escuchando timbres':S.qr.on?'Conectando…':'Apagado'}</span><span class="mut">Este dispositivo tiene que quedar encendido, con el portero abierto y con internet.</span></div></div>
  <div class="card"><div class="row" style="align-items:flex-start;gap:18px"><div class="qr" data-qr="${esc(u)}" style="width:230px;max-width:100%"></div>
   <div style="display:flex;flex-direction:column;gap:8px;flex:1;min-width:220px"><button class="btn y" data-act="qrprint">${ic('qr')} Imprimir cartel para la puerta</button><button class="btn" data-act="qrnfc">${ic('nfc')} Grabar sticker NFC</button><button class="btn" data-act="qrcopy">Copiar enlace</button><button class="btn" data-act="qropen">Abrir la página del visitante</button><button class="btn" data-act="qrtest">${ic('bell')} Probar timbre</button><button class="btn ghost" data-act="qrregen">Regenerar código (invalida carteles viejos)</button></div></div></div>
  <div class="grid2">${fld('WhatsApp de la asociación para que el visitante escriba (opcional)','qr.wa','tel','placeholder="+549387..."')}</div>
  <div class="card"><b>Cómo responde el personal</b><p class="mut" style="margin:6px 0 0">Desde la notificación del celular (botones <b style="color:var(--tx)">Ya voy · Un momento · No podemos</b>, ver «Avisos al celular») o desde este dispositivo cuando suena. El área que elige el visitante filtra a quién le llega el WhatsApp.</p></div>
  <div class="card"><b>Sticker NFC</b><p class="mut" style="margin:6px 0 0">Comprá stickers NFC NTAG213 o NTAG215. Desde un celular Android con Chrome, abrí este panel, tocá «Grabar sticker NFC» y apoyá el sticker atrás del celular. Pegalo junto al QR: el visitante acerca su celular y se abre el timbre.</p></div>`},
 pases(){return `<h3>Pases de visita</h3><p class="sub">Códigos temporales para visitas, proveedores o talleres. El visitante los ingresa en “Tengo un pase”, o los lee un lector QR USB/Bluetooth.</p>
  <div class="card"><div class="grid2"><div><label>Nombre del visitante</label><input id="pname" placeholder="Ej. Proveedor limpieza"></div>
   <div><label>Validez</label><select id="pexp"><option value="15">15 minutos</option><option value="60" selected>1 hora</option><option value="240">4 horas</option><option value="1440">24 horas</option></select></div>
   <div><label>Usos permitidos</label><input id="pmax" type="number" min="1" max="50" value="1"></div></div>
   <button class="btn y" style="margin-top:12px" data-act="padd">${ic('ticket')} Generar pase</button></div>
  ${PASSES.slice().reverse().map(p=>{const dead=(p.exp&&p.exp<now())||p.used>=p.max;return `<div class="card"><div class="row" style="align-items:flex-start;gap:16px"><div class="qr" data-qr="CNB-${p.code}"></div>
   <div style="flex:1;min-width:180px"><b style="font-size:20px">${esc(p.name)}</b><div style="font-size:30px;font-weight:800;letter-spacing:.12em;color:var(--y)">${p.code}</div>
   <div class="mut">${p.exp?'Vence '+fdt(p.exp):'Sin vencimiento'} · usos ${p.used}/${p.max} · <span class="tag ${dead?'bad':'ok'}">${dead?'No vigente':'Vigente'}</span></div>
   <div class="row" style="margin-top:10px"><a class="btn sm m" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Tu pase de visita para '+S.brand+': '+p.code+(p.exp?' (vence '+fdt(p.exp)+')':'')+'. Ingresalo en “Tengo un pase” en el portero.')}">Enviar por WhatsApp</a>
   <button class="btn sm bad" data-act="pdel" data-c="${p.code}">${ic('trash')}</button></div></div></div></div>`}).join('')}`},
 emerg(){return `<h3>Emergencias y PIN de coacción</h3><p class="sub">Configurá a quién se llama y cómo se avisa en silencio.</p>
  <div class="grid2">${fld('Número de emergencias','emNum')}${fld('Contacto de confianza (nombre)','trustName')}${fld('Contacto de confianza (teléfono)','trustNum','tel','placeholder="+549387..."')}</div>${sw('Al llamar al contacto, enviarle también un WhatsApp de auxilio (con ubicación si el dispositivo la permite)','trustWa')}<div class="grid2">${fld('Webhook de alertas (opcional, https)','webhook','url','placeholder="https://..."')}</div>
  <div class="card"><label>PIN de coacción silenciosa (${S.pinLen} dígitos)</label><p class="mut" style="margin:0 0 10px">Abre la puerta sin ningún aviso en pantalla y registra <b style="color:var(--tx)">CRITICAL_DURESS_EVENT</b> en la auditoría. Valor de fábrica: 9999 — cambialo en la instalación real.</p>
   <div class="row"><input id="newduress" type="password" inputmode="numeric" maxlength="${S.pinLen}" placeholder="Nuevo PIN de coacción" style="flex:1"><button class="btn sm y" data-act="setduress">Guardar</button></div></div>
  <div class="card"><p class="mut" style="margin:0">Al presionar Emergencia hay 3 segundos para cancelar y luego se dispara <b style="color:var(--tx)">tel:${esc(S.emNum||'911')}</b>. Sin cámaras no se capturan imágenes: el evento queda en el log con fecha y hora.</p></div>`},
 avisos(){const N=S.notif;return `<h3>Avisos al celular</h3><p class="sub">El portero avisa a los celulares que elijan los dueños: timbre, emergencia, alerta silenciosa y más. El dispositivo del portero necesita internet.</p>
  <div class="card"><b>1 · Notificación push (recomendado)</b>
   <p class="mut">Gratis y sin cuentas, con la app <b style="color:var(--tx)">ntfy</b> (Android e iOS). El aviso del timbre trae botones <b style="color:var(--tx)">Ya voy · Un momento · No podemos</b>: la respuesta se muestra y se escucha en la pantalla del portero. Cada persona instala la app y se suscribe al tema de abajo. El tema funciona como una contraseña: no lo compartan fuera del equipo.</p>
   ${sw('Activar notificaciones push','notif.ntfy.on')}

   ${N.ntfy.topic?`<div class="row" style="margin-top:12px;gap:16px;align-items:flex-start"><div class="qr" data-qr="${esc(String(N.ntfy.server).replace(/\/+$/,'')+'/'+N.ntfy.topic)}"></div><p class="mut" style="flex:1;min-width:180px;margin:0">Escaneen este QR con el celular para abrir el canal o, en la app ntfy, toquen “+” y escriban el tema.</p></div>`:''}</div>
  <div class="card"><b>2 · WhatsApp automático (opcional)</b>
   <p class="mut">Usa el servicio gratuito CallMeBot, que no es oficial de WhatsApp y es de uso personal. Cada persona debe activarlo una vez desde su propio WhatsApp siguiendo las instrucciones vigentes en callmebot.com y pegar acá la clave (apikey) que reciba. Teléfono con código de país, sin “+” ni espacios.</p>
   ${sw('Activar avisos por WhatsApp','notif.wa.on')}
   ${N.recips.map(r=>`<div class="card" data-r="${r.id}"><div class="grid2"><div><label>Nombre</label><input data-rf2="name" value="${esc(r.name)}"></div><div><label>Teléfono (ej. 5493874000000)</label><input data-rf2="phone" inputmode="tel" value="${esc(r.phone)}"></div><div><label>Apikey de CallMeBot</label><input data-rf2="key" value="${esc(r.key)}" autocomplete="off"></div><div><label>Recibe avisos de</label><select data-rf2="area"><option value="">Todas las áreas</option>${AREAS.map(a=>`<option value="${a.id}" ${r.area===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div></div><div class="row" style="justify-content:space-between;margin-top:10px"><button class="btn sm y" data-act="watest" data-id="${r.id}">Enviar prueba</button><button class="btn sm bad" data-act="wadel" data-id="${r.id}">${ic('trash')} Quitar</button></div></div>`).join('')}
   <button class="btn y" data-act="waadd">${ic('plus')} Agregar destinatario</button></div>
  <div class="card"><b>Qué se avisa</b>${sw('Timbre (visita en la puerta)','notif.ev.bell')}${sw('Emergencia (botón 911 o contacto)','notif.ev.sos')}${sw('Alerta silenciosa (PIN de coacción)','notif.ev.duress')}${sw('Bloqueo por intentos fallidos','notif.ev.lock')}${sw('Intentos fuera de horario','notif.ev.off')}</div>`},
 bio(){const B=S.bio,np=USERS.filter(hasPk).length,nf=USERS.filter(hasFace).length;return `<h3>Huella y rostro del personal</h3><p class="sub">Ingreso opcional para personal autorizado (roles Personal y Profesional) registrado previamente desde Accesos. Desactivado de fábrica.</p>
  <div class="card"><b>Huella o biometría del celular (passkeys)</b> ${pkOK()?'<span class="tag ok">Disponible</span>':'<span class="tag bad">Requiere HTTPS</span>'}
   <p class="mut">La huella se verifica en el celular o en el sensor del dispositivo: el portero no la ve ni la guarda, solo recibe una firma. Cada persona puede registrar su propio celular (escaneando un QR) o la huella de este dispositivo.</p>
   ${sw('Permitir ingreso con huella','bio.pk.on')}<p class="mut" style="margin:0">Personas con huella registrada: ${np}.</p>
   ${pkOK()?'':'<p class="mut">Abrí el portero desde su dirección web segura (https://…): no funciona desde un archivo descargado. Si cambia la dirección web hay que volver a registrar las huellas.</p>'}</div>
  <div class="card"><b>Reconocimiento facial</b> <span id="fastat" class="tag">Verificando modelo…</span>
   <p class="mut">La cámara se enciende solo cuando alguien toca “Reconocimiento facial”. No se guardan fotos ni videos: solo una plantilla numérica de cada persona registrada. Es menos seguro que la huella: un video de la persona podría engañarlo, por eso se exige un parpadeo.</p>
   ${sw('Permitir ingreso con reconocimiento facial','bio.face.on')}${sw('Exigir parpadeo (anti-foto)','bio.face.live')}
   <label>Exigencia de coincidencia: ${B.face.thr} <span class="mut">(más bajo = más estricto)</span></label><input type="range" data-bind="bio.face.thr" min="0.35" max="0.6" step="0.01" value="${B.face.thr}">
   <p class="mut" style="margin:8px 0 0">Personas con rostro registrado: ${nf}.</p></div>
  <div class="card"><b>Datos biométricos</b><p class="mut" style="margin:6px 0 0">Son datos personales sensibles. Registrá a cada persona solo con su consentimiento informado y por escrito (el panel lo marca y lo anota en la auditoría). Cada persona puede pedir que se borre su registro en cualquier momento desde Accesos. Las plantillas se guardan solo en este dispositivo.</p></div>`},
 voz(){const vs=voices();return `<h3>Asistente de voz</h3><p class="sub">Reconocimiento y síntesis nativos del navegador, sin APIs de pago.</p>
  ${sw('Asistente habilitado','voice.on')}${sw('Respuestas habladas','voice.tts')}${sw('Exigir palabra clave para ejecutar comandos','voice.wakeReq')}
  <div class="grid2">${fld('Palabra clave','voice.wake')}<div><label>Voz</label><select data-bind="voice.uri"><option value="">Automática (español)</option>${vs.map(v=>`<option value="${esc(v.voiceURI)}" ${S.voice.uri===v.voiceURI?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select></div>
   <div><label>Velocidad: ${S.voice.rate}</label><input type="range" data-bind="voice.rate" min="0.6" max="1.4" step="0.1" value="${S.voice.rate}"></div></div>
  <button class="btn" data-act="testvoice">${ic('vol')} Probar voz</button>
  <div class="card"><b>Comandos</b><p class="mut" style="margin:6px 0 0">“Abrir puerta” (pide PIN) · “Emergencia” / “Llamar al 911” · “Tocar timbre” o nombre de un área · “Horarios” · “Pase de visita” · “Dónde están”. Si preguntan por cámaras, responde que el portero no usa cámaras.</p></div>
  <p class="mut">${SR?'Reconocimiento de voz disponible en este navegador.':'Este navegador no ofrece reconocimiento de voz (usar Chrome o Edge). La entrada por texto sigue funcionando.'}</p>`},
 rele(){return `<h3>Relé y puerta</h3><p class="sub">Tiempo de apertura y conexión con la cerradura.</p>
  <div class="card"><label>Tiempo de relé: <b id="rmsl">${S.relayMs} ms</b></label><input type="range" data-bind="relayMs" min="100" max="10000" step="100" value="${S.relayMs}" id="rms"></div>
  <div class="grid2">${fld('URL del ESP32 en la red local','relayUrl','url','placeholder="http://192.168.1.50"')}${fld('Token','relayToken','text','placeholder="mismo que en el firmware"')}</div>
  <div class="row"><button class="btn y" data-act="testrelay">${ic('door')} Probar apertura</button>
   <button class="btn" data-act="serial">${ic('plug')} ${serialPort?'Puerto serie conectado':'Conectar puerto serie (COM)'}</button></div>
  <div class="card"><b>Plataforma detectada</b><p class="mut" style="margin:6px 0 0">${window.electronAPI?'Electron: API de escritorio disponible (ventana, kiosco, relé).':window.__TAURI__?'Tauri: API de escritorio disponible.':'Navegador / PWA. Web Serial: '+(('serial' in navigator)?'disponible':'no disponible')+'.'}</p></div>`},
 nfcqr(){const ok='NDEFReader' in window;return `<h3>NFC y QR de enlace</h3><p class="sub">Programá tarjetas NFC y generá el QR del enlace del cliente.</p>
  <div class="card">${fld('Enlace del cliente (web, WhatsApp, formulario…)','clientUrl','url','placeholder="https://..."')}
   <div class="row" style="margin-top:12px"><button class="btn y" data-act="nfcwrite" ${ok?'':'disabled'}>${ic('nfc')} Grabar enlace en tag NFC</button><button class="btn" data-act="qrlink">${ic('qr')} Generar QR</button></div>
   <p class="mut">${ok?'Acercá un tag NFC regrabable al dispositivo al presionar.':'Web NFC solo funciona en Android con Chrome y HTTPS.'}</p><div id="qrlink"></div></div>
  <div class="card"><b>Vincular tarjeta a una persona</b><p class="mut" style="margin:6px 0 0">En Accesos, presioná “Leer” junto a la persona y acercá la tarjeta.</p></div>`},
 integ(){return `<h3>Firmware e integración</h3><p class="sub">ESP32 para cerradura, apps de escritorio y PWA.</p>
  <div class="card"><b>Firmware ESP32 / Arduino</b><div class="row" style="margin:8px 0"><button class="btn sm y" data-act="dlfw">${ic('dl')} Descargar .ino</button><button class="btn sm" data-act="cpfw">Copiar</button></div><pre>${esc($('#fw').textContent)}</pre></div>
  <div class="card"><b>Escritorio Windows (Electron / Tauri)</b><p class="mut">El portero detecta <code>window.electronAPI</code> o <code>window.__TAURI__</code> y habilita minimizar, cerrar, pantalla completa y relé por puerto COM.</p><pre>${esc($('#electronsnip').textContent)}</pre></div>
  <div class="card"><b>App móvil / PWA</b><p class="mut">Para instalarlo en tablet: servir este archivo por HTTPS junto con manifest y service worker, o empaquetarlo con Capacitor. En iOS: Compartir → Agregar a inicio.</p>

  <div class="card"><p class="mut" style="margin:0">Sin cámaras no hace falta RTSP/ONVIF: la integración se limita a cerradura, timbre y avisos.</p></div>`},
 dev(){return `<h3>Soporte y desarrollador</h3><p class="sub">Datos de contacto para soporte, ajustes y nuevas funciones.</p>${svbBanner()}<div class="card"><b>Portero Digital SVB · v1.1</b><p class="mut" style="margin:6px 0 0">Cliente: ${esc(S.brand)}. Sin cámaras ni biometría. Datos guardados solo en este dispositivo.</p></div>`},
 audit(){const rows=LOG.slice().reverse();return `<h3>Log de auditoría</h3><p class="sub">${LOG.length} eventos guardados en este dispositivo (máx. 500).</p>
  <div class="row" style="margin-bottom:10px"><button class="btn sm" data-act="exjson">${ic('dl')} JSON</button><button class="btn sm" data-act="excsv">${ic('dl')} CSV</button><button class="btn sm bad" data-act="clrlog" id="clrlog">${ic('trash')} Vaciar</button></div>
  <div style="overflow:auto;max-height:62vh"><table><thead><tr><th>Fecha</th><th>Evento</th><th>Detalle</th></tr></thead><tbody>
  ${rows.map(r=>`<tr class="${r.crit?'crit':''}"><td>${fdt(r.ts)}</td><td><span class="tag ${r.crit?'bad':/OPEN|OK|USED|LOGIN/.test(r.type)?'ok':''}">${esc(r.type)}</span></td><td>${esc(r.detail)}</td></tr>`).join('')||'<tr><td colspan="3" class="mut">Sin eventos todavía.</td></tr>'}
  </tbody></table></div>`}
};
function paintQRs(){$$('[data-qr]').forEach(e=>{try{const q=qrcode(0,'M');q.addData(e.dataset.qr);q.make();e.innerHTML=q.createSvgTag({cellSize:4,margin:0,scalable:true})}catch(_){}})}
function bindAdm(b){
  $$('[data-bind]',b).forEach(i=>i.addEventListener('change',()=>cfg(i)));
  const r=$('#rms',b);r&&r.addEventListener('input',()=>{$('#rmsl').textContent=r.value+' ms'});
  $$('[data-uf]',b).forEach(i=>i.addEventListener('change',()=>{const u=USERS.find(x=>x.id===i.closest('[data-u]').dataset.u);u[i.dataset.uf]=i.type==='checkbox'?i.checked:i.value.trim();save();audit('CONFIG','Persona editada: '+u.name);if(i.dataset.uf==='role'){if(!BIO_ROLES.includes(u.role)&&(hasPk(u)||hasFace(u)||u.consent)){u.pk=[];u.face=null;u.consent=0;save();audit('BIO_DELETE','Biometría eliminada por cambio de rol · '+u.name,u.name)}admBody()}}));
  $$('[data-uconsent]',b).forEach(i=>i.addEventListener('change',()=>{const u=USERS.find(x=>x.id===i.closest('[data-u]').dataset.u);u.consent=i.checked?now():0;if(!i.checked){u.pk=[];u.face=null;audit('BIO_DELETE','Consentimiento retirado: biometría eliminada · '+u.name,u.name)}save();audit('CONSENT',(i.checked?'Consentimiento biométrico registrado · ':'Consentimiento biométrico retirado · ')+u.name,u.name);admBody()}));
  $$('[data-af]',b).forEach(i=>i.addEventListener('change',()=>{const a=AREAS.find(x=>x.id===i.closest('[data-a]').dataset.a);a[i.dataset.af]=i.value.trim();save();audit('CONFIG','Área editada: '+a.name)}));
  $$('[data-rf]',b).forEach(i=>i.addEventListener('change',()=>{const[d,idx,k]=i.dataset.rf.split(':');S.sched[d][+idx][k]=i.value||'00:00';sv();admBody()}));
  $$('[data-rf2]',b).forEach(i=>i.addEventListener('change',()=>{const r=S.notif.recips.find(x=>x.id===i.closest('[data-r]').dataset.r);r[i.dataset.rf2]=i.value.trim();save();audit('CONFIG','Destinatario de avisos editado')}));
  const lf=$('#logoFile',b);lf&&lf.addEventListener('change',()=>{const f=lf.files[0];if(!f)return;if(f.size>1.5e6){toast('El logo es muy pesado (máx. 1,5 MB)');return}
    const fr=new FileReader();fr.onload=()=>{S.logo=fr.result;if(!LS.set('cnb_set',S)){toast('No se pudo guardar el logo');}save();audit('CONFIG','Logo actualizado');build();paintBrand();admBody()};fr.readAsDataURL(f)});
}
function cfg(i){
  const path=i.dataset.bind.split('.');let v=i.type==='checkbox'?i.checked:(i.type==='number'||i.type==='range')?Number(i.value):i.value.trim();
  if(i.dataset.bind==='pinLen')v=Math.min(6,Math.max(4,v||4));
  let o=S;path.slice(0,-1).forEach(k=>o=o[k]);o[path.at(-1)]=v;save();audit('CONFIG',i.dataset.bind+' actualizado');
  if(['brand','sub','tagline','addr','mode','emNum','voice.on','enMode','offStaff','bio.pk.on','bio.face.on'].includes(i.dataset.bind)){build();paintBrand()}
  if(i.dataset.bind==='enMode')admBody();
  if(i.dataset.bind==='qr.on'||i.dataset.bind==='qr.wa'||i.dataset.bind==='notif.ntfy.server'){ctlKey='';startCtl();if(TAB==='portero')admBody()}
  if(i.dataset.bind==='pinLen'){toast('Largo de PIN cambiado: volvé a definir los PIN de cada persona y el de coacción.',4500);admBody()}
  tick();
}
const sv=()=>{save();audit('CONFIG','Horarios del portero actualizados');build();tick()};
const ADM={
 async pkreg(b){const u=USERS.find(x=>x.id===b.dataset.id),ph=b.dataset.k==='phone';if(!u||!u.consent)return toast('Registrá primero el consentimiento');if(!pkOK())return toast('Requiere abrir el portero por HTTPS (no desde un archivo local)',4500);
   toast(ph?'Elegí “usar un celular o tablet” y escaneá el QR':'Poné el dedo en el sensor del dispositivo',5000);
   try{await pkRegister(u,ph?'cross-platform':'platform');save();audit('BIO_ENROLL','Huella registrada ('+(ph?'celular':'dispositivo')+') · '+u.name,u.name);admBody();toast('Huella registrada')}
   catch(e){toast(e&&e.name==='NotAllowedError'?'Cancelado o tiempo agotado':'No se pudo registrar: '+(e.message||e.name),4500)}},
 pkdel(b){const u=USERS.find(x=>x.id===b.dataset.id);u.pk=(u.pk||[]).filter(k=>k.id!==b.dataset.cid);save();audit('BIO_DELETE','Huella eliminada · '+u.name,u.name);admBody()},
 facereg(b){const u=USERS.find(x=>x.id===b.dataset.id);if(!u||!u.consent)return toast('Registrá primero el consentimiento');faceEnroll(u)},
 facedel(b){const u=USERS.find(x=>x.id===b.dataset.id);u.face=null;save();audit('BIO_DELETE','Rostro eliminado · '+u.name,u.name);admBody()},
